<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wanderer's Path</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Share+Tech+Mono&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#0a0500;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Share Tech Mono',monospace;padding:8px;}

  #game-wrap{
    width:100%;max-width:780px;
    border:3px solid #6a4a00;
    outline:1px solid #3a2800;
    box-shadow:0 0 60px #80500033, inset 0 0 80px #00000088;
    background:#0e0800;
  }

  /* ── top bar ── */
  #topbar{
    background:linear-gradient(180deg,#2a1800 0%,#1a0e00 100%);
    border-bottom:2px solid #6a4a00;
    padding:5px 14px;
    display:flex;justify-content:space-between;align-items:center;
    position:relative;
  }
  /* ornament lines */
  #topbar::before{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#c8900044,#c89000,#c8900044,transparent);}
  #game-title{color:#c89000;font-size:12px;letter-spacing:3px;text-shadow:0 0 10px #c8900088;}
  .top-btn{background:none;border:1px solid #6a4a0088;color:#a07020;font-family:'Share Tech Mono',monospace;font-size:10px;padding:2px 10px;cursor:pointer;}
  .top-btn:hover{border-color:#c89000;color:#c89000;}

  /* ── scene canvas ── */
  #scene-wrap{position:relative;width:100%;line-height:0;border-bottom:2px solid #6a4a00;}
  #scene{width:100%;display:block;image-rendering:pixelated;}

  /* HUD overlay */
  #hud{
    position:absolute;top:8px;right:8px;
    background:rgba(6,3,0,0.82);
    border:1px solid #6a4a00;
    border-top:2px solid #c89000;
    padding:7px 10px;font-size:10px;color:#a07020;min-width:100px;
  }
  .hrow{display:flex;justify-content:space-between;gap:10px;margin-bottom:3px;}
  .hval{color:#c89000;}
  .hbar{background:#0e0800;border:1px solid #4a3000;height:5px;margin-bottom:5px;}
  .hbar-fill{height:100%;transition:width 0.4s;}
  #hud-hp{background:linear-gradient(90deg,#801010,#c83020);}
  #hud-xp{background:linear-gradient(90deg,#103880,#2060c0);}

  /* ── inventory ── */
  #inv-bar{
    background:linear-gradient(180deg,#120900,#0a0500);
    border-bottom:2px solid #6a4a00;
    padding:5px 12px;
    display:flex;align-items:center;gap:5px;
    position:relative;
  }
  #inv-bar::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#c8900033,transparent);}
  .inv-label{font-size:9px;color:#6a4a00;letter-spacing:2px;margin-right:4px;text-transform:uppercase;}
  .inv-slot{
    background:#0a0600;
    border:1px solid #4a3000;
    width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;cursor:default;
    box-shadow:inset 0 0 6px #00000088;
  }
  .inv-slot:hover{border-color:#c89000;}
  #gold-display{margin-left:auto;font-size:11px;color:#c89000;text-shadow:0 0 6px #c8900066;}

  /* ── log ── */
  #log-wrap{
    background:linear-gradient(180deg,#0a0600,#080400);
    border-bottom:1px solid #4a3000;
    padding:8px 14px;min-height:52px;max-height:72px;
    overflow-y:auto;
    position:relative;
  }
  #log-wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#c8900022,transparent);}
  #log-wrap::-webkit-scrollbar{width:3px;}
  #log-wrap::-webkit-scrollbar-thumb{background:#4a3000;}
  .log-line{font-size:11px;line-height:1.7;color:#c8a060;}
  .log-line.good{color:#70b860;}.log-line.bad{color:#c85040;}.log-line.sys{color:#c89000;font-style:italic;}

  /* ── choices ── */
  #choices-bar{
    background:linear-gradient(180deg,#120900,#080400);
    padding:7px 10px;min-height:56px;
    display:flex;align-items:center;
    border-top:1px solid #4a3000;
  }
  #choices-inner{display:flex;flex-wrap:wrap;gap:5px;width:100%;}
  .choice-btn{
    background:linear-gradient(180deg,#1e1200,#100800);
    border:1px solid #6a4a0088;
    color:#c8a060;
    font-family:'Share Tech Mono',monospace;font-size:11px;
    padding:5px 12px;cursor:pointer;
    flex:1;min-width:150px;text-align:left;
    box-shadow:inset 0 0 10px #00000066;
    transition:all 0.12s;
  }
  .choice-btn:hover{background:linear-gradient(180deg,#2a1a00,#1a0e00);border-color:#c89000;color:#c89000;box-shadow:0 0 8px #c8900022,inset 0 0 10px #00000066;}
  .choice-btn:disabled{opacity:0.3;cursor:not-allowed;}
  #status-txt{color:#a07020;font-size:11px;width:100%;}
</style>
</head>
<body>
<div id="game-wrap">
  <div id="topbar">
    <span id="game-title">✦ THE WANDERER'S PATH ✦</span>
    <button class="top-btn" id="voice-btn" onclick="toggleVoice()">♪ NARRATOR: ON</button>
  </div>
  <div id="scene-wrap">
    <canvas id="scene"></canvas>
    <div id="hud">
      <div class="hrow">HP <span class="hval" id="hp-txt">20/20</span></div>
      <div class="hbar"><div class="hbar-fill" id="hud-hp" style="width:100%"></div></div>
      <div class="hrow">XP <span class="hval" id="xp-txt">0</span></div>
      <div class="hbar"><div class="hbar-fill" id="hud-xp" style="width:0%"></div></div>
      <div class="hrow">📍 <span class="hval" id="loc-txt">meadow</span></div>
    </div>
  </div>
  <div id="inv-bar">
    <span class="inv-label">Pack</span>
    <div id="inv-slots" style="display:flex;gap:4px;"></div>
    <span id="gold-display">⬡ <span id="gold-txt">5</span></span>
  </div>
  <div id="log-wrap"></div>
  <div id="choices-bar">
    <div id="choices-inner"><span id="status-txt">▸ Loading world...</span></div>
  </div>
</div>
<script>
const S={hp:20,maxHp:20,xp:0,gold:5,inv:[],history:[],scene:'meadow'};

// ── Audio ──────────────────────────────────────────────────────────────
let actx=null;
function ac(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
function tone(freq,dur,delay=0,vol=0.06,type='sine'){
  try{const ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);o.type=type;o.frequency.value=freq;
  const t=ctx.currentTime+delay;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.03);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t);o.stop(t+dur+0.05);}catch(e){}
}
function sndPickup(){[523,659,784].forEach((f,i)=>tone(f,0.18,i*0.1));}
function sndCoin(){tone(880,0.1);tone(1100,0.1,0.08);}
function sndHeal(){tone(528,0.4,0,0.05);}
function sndBump(){tone(220,0.15,0,0.06,'square');tone(180,0.18,0.1,0.04,'square');}
function sndGrass(){
  try{const ctx=ac(),buf=ctx.createBuffer(1,ctx.sampleRate*0.07,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  src.buffer=buf;f.type='bandpass';f.frequency.value=1000;f.Q.value=0.5;
  g.gain.setValueAtTime(0.14,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.07);
  src.connect(f);f.connect(g);g.connect(ctx.destination);src.start();src.stop(ctx.currentTime+0.08);}catch(e){}
}

// ── TTS (ElevenLabs — works on hosted page) ────────────────────────────
let voiceOn=true,curAudio=null;
const XI_KEY='sk_ba08c6246de3fc999a143a77c6c31601acb3dac580a14f26';
const XI_VOICE='N2lVS1w4EtoT3dr4eOWO';
async function speak(text){
  if(!voiceOn)return;
  if(curAudio){curAudio.pause();curAudio=null;}
  try{
    const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${XI_VOICE}`,{
      method:'POST',
      headers:{'xi-api-key':XI_KEY,'Content-Type':'application/json','Accept':'audio/mpeg'},
      body:JSON.stringify({text,model_id:'eleven_turbo_v2',voice_settings:{stability:0.4,similarity_boost:0.75,style:0.55,use_speaker_boost:true}})
    });
    if(!r.ok)return;
    curAudio=new Audio(URL.createObjectURL(await r.blob()));
    curAudio.play().catch(()=>{});
  }catch(e){}
}
function toggleVoice(){
  voiceOn=!voiceOn;
  if(!voiceOn&&curAudio){curAudio.pause();curAudio=null;}
  document.getElementById('voice-btn').textContent=`♪ NARRATOR: ${voiceOn?'ON':'OFF'}`;
}

// ── Canvas / scene renderer ────────────────────────────────────────────
const cv=document.getElementById('scene'),cx=cv.getContext('2d');
let af=0,lastStep=0,isWalking=false;

function resizeCanvas(){
  const w=document.getElementById('scene-wrap').clientWidth||780;
  cv.width=w; cv.height=Math.round(w*0.4);
}

// ── Painting helpers ───────────────────────────────────────────────────
function grad(x1,y1,x2,y2,...stops){
  const g=cx.createLinearGradient(x1,y1,x2,y2);
  stops.forEach(([s,c])=>g.addColorStop(s,c));
  return g;
}
function radGrad(x,y,r,...stops){
  const g=cx.createRadialGradient(x,y,0,x,y,r);
  stops.forEach(([s,c])=>g.addColorStop(s,c));
  return g;
}

// Noise texture overlay for that gritty DOS feel
function paintNoise(alpha=0.06){
  const id=cx.createImageData(cv.width,cv.height);
  for(let i=0;i<id.data.length;i+=4){
    const v=Math.random()*255|0;
    id.data[i]=id.data[i+1]=id.data[i+2]=v;
    id.data[i+3]=alpha*255|0;
  }
  cx.putImageData(id,0,0);
}

function paintTree(x,y,sc=1){
  cx.fillStyle='#2a1400';cx.fillRect(x-4*sc,y,7*sc,32*sc);
  const layers=[[0,'#0e2808'],[10,'#142e0a'],[18,'#1c3e0e'],[26,'#244a12'],[32,'#2e5816']];
  layers.forEach(([dy,col])=>{
    cx.fillStyle=col;
    cx.beginPath();cx.ellipse(x,y-dy*sc,(24-dy*0.4)*sc,(18-dy*0.3)*sc,0,0,Math.PI*2);cx.fill();
  });
  // highlight
  cx.fillStyle='rgba(80,160,40,0.15)';
  cx.beginPath();cx.ellipse(x-6*sc,y-36*sc,8*sc,5*sc,-0.4,0,Math.PI*2);cx.fill();
}

function paintBush(x,y,sc=1){
  cx.fillStyle='#183008';cx.beginPath();cx.ellipse(x,y,14*sc,9*sc,0,0,Math.PI*2);cx.fill();
  cx.fillStyle='#224010';cx.beginPath();cx.ellipse(x-5*sc,y-2*sc,9*sc,7*sc,0,0,Math.PI*2);cx.fill();
  cx.fillStyle='#2a4e12';cx.beginPath();cx.ellipse(x+4*sc,y-3*sc,8*sc,6*sc,0,0,Math.PI*2);cx.fill();
}

function paintRock(x,y,sc=1){
  cx.fillStyle='#302820';cx.beginPath();cx.ellipse(x,y,12*sc,8*sc,0.2,0,Math.PI*2);cx.fill();
  cx.fillStyle='#483c2c';cx.beginPath();cx.ellipse(x-3*sc,y-2*sc,7*sc,5*sc,0.2,0,Math.PI*2);cx.fill();
  cx.fillStyle='rgba(255,220,160,0.08)';cx.beginPath();cx.ellipse(x-4*sc,y-3*sc,4*sc,3*sc,0.3,0,Math.PI*2);cx.fill();
}

function paintHouse(x,y,w=110,h=80){
  // wall shadow
  cx.fillStyle='#0e0800';cx.fillRect(x+4,y+h*0.3+4,w,h*0.7);
  // wall
  cx.fillStyle=grad(x,y+h*0.3,x+w,y+h,[0,'#9a7830'],[0.5,'#7a5c20'],[1,'#5a4010']);
  cx.fillRect(x,y+h*0.3,w,h*0.7);
  // stone texture
  cx.strokeStyle='rgba(0,0,0,0.2)';cx.lineWidth=1;
  for(let r=0;r<4;r++)for(let c=0;c<5;c++){const bx=x+c*(w/5)+(r%2?w/10:0),by=y+h*0.32+r*14;cx.strokeRect(bx,by,w/5-1,12);}
  // roof
  cx.fillStyle='#601008';
  cx.beginPath();cx.moveTo(x-8,y+h*0.32);cx.lineTo(x+w/2,y);cx.lineTo(x+w+8,y+h*0.32);cx.fill();
  cx.fillStyle='#480c06';
  cx.beginPath();cx.moveTo(x+w/2,y);cx.lineTo(x+w+8,y+h*0.32);cx.lineTo(x+w/2,y+h*0.32);cx.fill();
  // door
  cx.fillStyle='#301800';cx.fillRect(x+w*0.36,y+h*0.62,w*0.26,h*0.38);
  cx.fillStyle='#502408';cx.beginPath();cx.arc(x+w*0.49,y+h*0.64,w*0.13,Math.PI,0);cx.fill();
  cx.fillStyle='#c89000';cx.beginPath();cx.arc(x+w*0.6,y+h*0.76,2.5,0,Math.PI*2);cx.fill();
  // windows
  [[x+w*0.05,y+h*0.42],[x+w*0.7,y+h*0.42]].forEach(([wx,wy])=>{
    cx.fillStyle='#0a0c18';cx.fillRect(wx,wy,w*0.2,h*0.2);
    cx.fillStyle='rgba(180,200,255,0.15)';cx.fillRect(wx+2,wy+2,w*0.2-4,h*0.2-4);
    cx.fillStyle='rgba(0,0,0,0.4)';cx.fillRect(wx+w*0.09,wy,2,h*0.2);cx.fillRect(wx,wy+h*0.09,w*0.2,2);
    // candlelight glow
    const gl=radGrad(wx+w*0.1,wy+h*0.1,w*0.15,[0,'rgba(255,180,60,0.12)'],[1,'rgba(255,180,60,0)']);
    cx.fillStyle=gl;cx.fillRect(wx-10,wy-10,w*0.4,h*0.4);
  });
  // chimney
  cx.fillStyle='#502010';cx.fillRect(x+w*0.6,y-h*0.05,w*0.14,h*0.3);
  cx.fillStyle='rgba(160,150,140,0.22)';
  [0,1,2].forEach(i=>{cx.beginPath();cx.arc(x+w*0.67,y-h*0.1-i*11,5+i*3,0,Math.PI*2);cx.fill();});
}

function paintMushroom(x,y,sc=1){
  cx.fillStyle='#c0b888';cx.fillRect(x-3*sc,y,6*sc,12*sc);
  cx.fillStyle='#8a1808';cx.beginPath();cx.arc(x,y,11*sc,Math.PI,0);cx.fill();
  cx.fillStyle='#681006';cx.beginPath();cx.arc(x+4*sc,y,4*sc,Math.PI,0);cx.fill();
  cx.fillStyle='rgba(255,255,240,0.7)';
  [[-5,3],[3,1],[0,-3]].forEach(([dx,dy])=>{cx.beginPath();cx.arc(x+dx*sc,y+dy*sc,2.5*sc,0,Math.PI*2);cx.fill();});
}

function paintWater(y,h){
  const t=Date.now()/1200;
  cx.fillStyle=grad(0,y,0,y+h,[0,'#0e3060'],[0.4,'#1a4a80'],[1,'#0a2040']);
  cx.fillRect(0,y,cv.width,h);
  // shimmer
  cx.fillStyle='rgba(100,160,255,0.12)';
  for(let i=0;i<8;i++){const wx=(i*120+t*30)%cv.width;cx.fillRect(wx,y+h*0.3,40,2);cx.fillRect(wx+30,y+h*0.65,24,2);}
  // shore edge
  cx.fillStyle='#6a5020';cx.fillRect(0,y-3,cv.width,5);
  cx.fillStyle='#4a3810';cx.fillRect(0,y+h-1,cv.width,4);
}

function paintPath(y,h){
  cx.fillStyle=grad(0,y,0,y+h,[0,'#8a6020'],[0.5,'#6a4a18'],[1,'#4a3010']);
  cx.fillRect(0,y,cv.width,h);
  cx.fillStyle='rgba(0,0,0,0.15)';
  for(let i=0;i<12;i++)cx.fillRect(i*(cv.width/10)+(i%3)*8,y+h*0.4,cv.width/14,2);
}

// NPC — glowing emoji with painted halo
function paintNPC(x,y,emoji,sc=1){
  const sz=Math.round(cv.width*0.06*sc);
  const gl=radGrad(x,y,sz*1.2,[0,'rgba(200,180,80,0.18)'],[1,'rgba(200,180,80,0)']);
  cx.fillStyle=gl;cx.beginPath();cx.arc(x,y,sz*1.5,0,Math.PI*2);cx.fill();
  cx.font=`${sz}px serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(emoji,x,y);
}

// Player — painted hooded figure
function paintPlayer(px,py){
  const s=cv.width/600;
  cx.fillStyle='rgba(0,0,0,0.25)';cx.beginPath();cx.ellipse(px,py+22*s,13*s,4*s,0,0,Math.PI*2);cx.fill();
  // cloak
  cx.fillStyle='#1e1440';
  cx.beginPath();cx.moveTo(px,py-24*s);cx.lineTo(px-14*s,py+24*s);cx.lineTo(px+14*s,py+24*s);cx.fill();
  cx.fillStyle='#2a1c58';
  cx.beginPath();cx.moveTo(px,py-24*s);cx.lineTo(px-14*s,py+24*s);cx.lineTo(px,py+18*s);cx.fill();
  // boots
  cx.fillStyle='#1a0c00';cx.fillRect(px-10*s,py+18*s,8*s,6*s);cx.fillRect(px+2*s,py+18*s,8*s,6*s);
  // face
  cx.fillStyle='#d0a060';cx.beginPath();cx.arc(px,py-14*s,8*s,0,Math.PI*2);cx.fill();
  // hood shadow
  cx.fillStyle='rgba(0,0,0,0.4)';cx.beginPath();cx.arc(px,py-12*s,8*s,Math.PI*0.1,Math.PI*0.9);cx.fill();
  // hood
  cx.fillStyle='#1e1440';cx.beginPath();cx.arc(px,py-16*s,11*s,Math.PI,0);cx.fill();
  cx.beginPath();cx.moveTo(px-11*s,py-16*s);cx.lineTo(px-8*s,py-8*s);cx.lineTo(px+8*s,py-8*s);cx.lineTo(px+11*s,py-16*s);cx.fill();
  // eyes glow
  cx.fillStyle='rgba(255,220,120,0.7)';cx.beginPath();cx.arc(px-3*s,py-15*s,1.5*s,0,Math.PI*2);cx.fill();cx.beginPath();cx.arc(px+3*s,py-15*s,1.5*s,0,Math.PI*2);cx.fill();
  // staff
  cx.strokeStyle='#6a3a10';cx.lineWidth=2.5*s;cx.beginPath();cx.moveTo(px+12*s,py-26*s);cx.lineTo(px+16*s,py+24*s);cx.stroke();
  const gl=radGrad(px+12*s,py-28*s,7*s,[0,'rgba(80,255,160,0.8)'],[1,'rgba(80,255,160,0)']);
  cx.fillStyle=gl;cx.beginPath();cx.arc(px+12*s,py-28*s,7*s,0,Math.PI*2);cx.fill();
}

// ── Scene definitions ──────────────────────────────────────────────────
const SCENES={
  meadow(W,H){
    // sky — warm afternoon
    cx.fillStyle=grad(0,0,0,H*0.48,[0,'#3a5070'],[0.4,'#6a8090'],[1,'#8aa870']);cx.fillRect(0,0,W,H*0.48);
    // sun glow
    cx.fillStyle=radGrad(W*0.75,H*0.1,H*0.3,[0,'rgba(255,220,100,0.25)'],[1,'rgba(255,220,100,0)']);cx.fillRect(0,0,W,H*0.5);
    // distant hills
    cx.fillStyle='#2a4818';cx.beginPath();cx.ellipse(W*0.2,H*0.47,W*0.28,H*0.1,0,0,Math.PI*2);cx.fill();
    cx.fillStyle='#344e1e';cx.beginPath();cx.ellipse(W*0.72,H*0.46,W*0.24,H*0.09,0,0,Math.PI*2);cx.fill();
    // ground
    cx.fillStyle=grad(0,H*0.46,0,H,[0,'#3a6018'],[0.4,'#2e4e12'],[1,'#1a2e08']);cx.fillRect(0,H*0.46,W,H*0.54);
    paintPath(H*0.6,H*0.22);
    paintBush(W*0.15,H*0.58,0.8);paintBush(W*0.6,H*0.54,0.7);paintRock(W*0.78,H*0.62,0.9);
    paintTree(W*0.07,H*0.44,0.75);paintTree(W*0.55,H*0.42,0.9);paintTree(W*0.86,H*0.43,0.72);
    paintNPC(W*0.7,H*0.55,'🧙');paintNPC(W*0.22,H*0.57,'🐇');
    paintNoise(0.04);
  },
  village(W,H){
    // dusk sky
    cx.fillStyle=grad(0,0,0,H*0.45,[0,'#1a0e08'],[0.3,'#4a2808'],[0.7,'#6a4018'],[1,'#4a5830']);cx.fillRect(0,0,W,H*0.45);
    cx.fillStyle=radGrad(W*0.55,0,H*0.5,[0,'rgba(220,120,40,0.4)'],[1,'rgba(220,120,40,0)']);cx.fillRect(0,0,W,H*0.5);
    cx.fillStyle=grad(0,H*0.44,0,H,[0,'#3a5020'],[1,'#182010']);cx.fillRect(0,H*0.44,W,H*0.56);
    paintPath(H*0.6,H*0.22);
    paintHouse(W*0.02,H*0.06,W*0.25,H*0.44);
    paintHouse(W*0.58,H*0.04,W*0.22,H*0.46);
    // well
    cx.fillStyle='#505050';cx.fillRect(W*0.39,H*0.48,W*0.1,H*0.2);
    cx.fillStyle='#0e2840';cx.fillRect(W*0.4,H*0.54,W*0.08,H*0.12);
    cx.fillStyle='#5a3000';cx.fillRect(W*0.37,H*0.38,W*0.014,H*0.12);cx.fillRect(W*0.465,H*0.38,W*0.014,H*0.12);
    cx.fillStyle='#7a4000';cx.fillRect(W*0.36,H*0.37,W*0.125,H*0.04);
    paintTree(W*0.84,H*0.36,0.7);paintBush(W*0.3,H*0.58,0.7);
    paintNPC(W*0.5,H*0.6,'👨‍🌾');paintNPC(W*0.28,H*0.61,'🐑');
    paintNoise(0.05);
  },
  forest(W,H){
    // deep forest — very dark
    cx.fillStyle=grad(0,0,0,H,[0,'#050d04'],[0.5,'#0a1408'],[1,'#060e04']);cx.fillRect(0,0,W,H);
    // god rays through canopy
    cx.fillStyle='rgba(100,180,60,0.05)';
    [0.28,0.45,0.62].forEach(fx=>{cx.beginPath();cx.moveTo(fx*W-10,0);cx.lineTo(fx*W-40,H);cx.lineTo(fx*W+40,H);cx.lineTo(fx*W+10,0);cx.fill();});
    paintPath(H*0.64,H*0.22);
    // dense background trees
    [[0.05,0.5],[0.18,0.44],[0.32,0.48],[0.48,0.42],[0.62,0.46],[0.75,0.44],[0.88,0.48],[0.95,0.5]].forEach(([fx,fy])=>paintTree(fx*W,fy*H,0.55+(fx*0.3)));
    paintMushroom(W*0.34,H*0.66,1);paintMushroom(W*0.56,H*0.64,0.8);
    paintBush(W*0.2,H*0.66,0.9);paintBush(W*0.7,H*0.65,0.8);paintRock(W*0.45,H*0.7,0.9);
    paintNPC(W*0.5,H*0.62,'🦊');
    paintNoise(0.06);
  },
  tavern(W,H){
    // stone back wall
    cx.fillStyle=grad(0,0,0,H*0.55,[0,'#0e0800'],[1,'#1e1206']);cx.fillRect(0,0,W,H*0.55);
    cx.strokeStyle='rgba(0,0,0,0.35)';cx.lineWidth=1;
    for(let r=0;r<5;r++)for(let c=0;c<12;c++){const bx=c*(W/11)+(r%2?W/22:0),by=r*20+4;cx.strokeRect(bx,by,W/11-1,18);}
    // floor
    cx.fillStyle=grad(0,H*0.54,0,H,[0,'#281402'],[1,'#100800']);cx.fillRect(0,H*0.54,W,H*0.46);
    for(let i=0;i<9;i++){cx.fillStyle=i%2===0?'rgba(0,0,0,0.1)':'rgba(255,200,100,0.03)';cx.fillRect(0,H*0.55+i*10,W,9);}
    // fireplace — right side
    const fx=W*0.7,fy=H*0.06;
    cx.fillStyle='#383030';cx.fillRect(fx,fy,W*0.2,H*0.44);
    cx.fillStyle='#0e0808';cx.fillRect(fx+8,fy+H*0.1,W*0.2-16,H*0.34);
    // fire glow
    const fg=radGrad(fx+W*0.1,fy+H*0.3,W*0.22,[0,'rgba(255,120,20,0.35)'],[0.5,'rgba(200,80,10,0.12)'],[1,'rgba(200,80,10,0)']);
    cx.fillStyle=fg;cx.fillRect(0,0,W,H);
    cx.fillStyle='#e05010';cx.fillRect(fx+12,fy+H*0.2,W*0.2-24,H*0.24);
    cx.fillStyle='#ffa020';cx.fillRect(fx+18,fy+H*0.26,W*0.2-36,H*0.15);
    cx.fillStyle='#ffdc40';cx.fillRect(fx+22,fy+H*0.3,W*0.2-44,H*0.08);
    // bar counter
    cx.fillStyle=grad(0,H*0.5,0,H*0.7,[0,'#6a3808'],[1,'#3a1c00']);cx.fillRect(0,H*0.5,W*0.38,H*0.5);
    cx.fillStyle='#8a4a10';cx.fillRect(0,H*0.5,W*0.38,5);
    // bottles shelf
    cx.fillStyle='#5a3000';cx.fillRect(W*0.04,H*0.2,W*0.28,5);
    ['#8a1010','#104888','#106040','#886010','#481888'].forEach((col,i)=>{
      cx.fillStyle=col;cx.fillRect(W*0.06+i*W*0.05,H*0.06,W*0.025,W*0.04);
      cx.fillStyle='rgba(255,255,255,0.15)';cx.fillRect(W*0.062+i*W*0.05,H*0.07,W*0.006,W*0.018);
    });
    // mugs
    cx.fillStyle='#a07830';cx.fillRect(W*0.07,H*0.42,18,16);cx.fillRect(W*0.16,H*0.42,18,16);
    cx.fillStyle='#c8a030';cx.fillRect(W*0.072,H*0.43,14,2);cx.fillRect(W*0.162,H*0.43,14,2);
    // candle on table
    cx.fillStyle='#e8d8a0';cx.fillRect(W*0.5,H*0.46,5,12);
    const cl=radGrad(W*0.5025,H*0.44,14,[0,'rgba(255,200,80,0.3)'],[1,'rgba(255,200,80,0)']);
    cx.fillStyle=cl;cx.beginPath();cx.arc(W*0.5025,H*0.44,14,0,Math.PI*2);cx.fill();
    cx.fillStyle='#ffcc40';cx.beginPath();cx.arc(W*0.5025,H*0.455,3,0,Math.PI*2);cx.fill();
    paintNPC(W*0.22,H*0.52,'🍺');paintNPC(W*0.6,H*0.54,'🎶');
    paintNoise(0.05);
  },
  river(W,H){
    cx.fillStyle=grad(0,0,0,H*0.4,[0,'#1a2830'],[0.4,'#304858'],[1,'#405840']);cx.fillRect(0,0,W,H*0.4);
    cx.fillStyle=radGrad(W*0.3,H*0.05,H*0.35,[0,'rgba(180,220,255,0.18)'],[1,'rgba(180,220,255,0)']);cx.fillRect(0,0,W,H*0.45);
    cx.fillStyle=grad(0,H*0.38,0,H*0.6,[0,'#304820'],[1,'#1e3010']);cx.fillRect(0,H*0.38,W,H*0.22);
    paintWater(H*0.38,H*0.32);
    cx.fillStyle=grad(0,H*0.7,0,H,[0,'#283818'],[1,'#141e0a']);cx.fillRect(0,H*0.7,W,H*0.3);
    paintPath(H*0.76,H*0.18);
    paintTree(W*0.06,H*0.2,0.7);paintTree(W*0.8,H*0.18,0.75);paintTree(W*0.92,H*0.22,0.6);
    paintBush(W*0.25,H*0.42,0.7);paintBush(W*0.65,H*0.4,0.6);
    [[W*0.18,H*0.44],[W*0.42,H*0.42],[W*0.72,H*0.43]].forEach(([fx,fy])=>{
      cx.fillStyle='#d060a0';cx.beginPath();cx.arc(fx,fy,4,0,Math.PI*2);cx.fill();
      cx.fillStyle='#ffaacc';cx.beginPath();cx.arc(fx,fy,2,0,Math.PI*2);cx.fill();
    });
    paintNPC(W*0.48,H*0.36,'🦆');
    paintNoise(0.04);
  }
};

function renderScene(){
  const W=cv.width,H=cv.height;
  (SCENES[S.scene]||SCENES.meadow)(W,H);
  const bob=Math.sin(af*0.07)*2.5;
  paintPlayer(W/2,H*0.7+bob);
  if(isWalking&&Math.sin(af*0.07)>0.95&&af-lastStep>10){sndGrass();lastStep=af;}
  af++;
  requestAnimationFrame(renderScene);
}

// ── UI ─────────────────────────────────────────────────────────────────
const EMOJIS={'honey cake':'🍯','warm scarf':'🧣','lucky acorn':'🌰','mushroom':'🍄','gold coin':'🪙','lantern':'🏮','flower bouquet':'💐','healing herb':'🌿','bread loaf':'🍞','map fragment':'🗺️','fish':'🐟','key':'🗝️'};

function updateStats(){
  document.getElementById('hp-txt').textContent=`${S.hp}/${S.maxHp}`;
  document.getElementById('hud-hp').style.width=Math.max(0,(S.hp/S.maxHp)*100)+'%';
  document.getElementById('xp-txt').textContent=S.xp;
  document.getElementById('hud-xp').style.width=Math.min(100,S.xp%100)+'%';
  document.getElementById('gold-txt').textContent=S.gold;
  document.getElementById('loc-txt').textContent=S.scene;
  const sl=document.getElementById('inv-slots');sl.innerHTML='';
  for(let i=0;i<8;i++){const d=document.createElement('div');d.className='inv-slot';d.textContent=S.inv[i]?(EMOJIS[S.inv[i].toLowerCase()]||'📦'):'·';if(S.inv[i])d.title=S.inv[i];sl.appendChild(d);}
}

function log(text,cls=''){
  const box=document.getElementById('log-wrap');
  const d=document.createElement('div');d.className='log-line'+(cls?' '+cls:'');d.textContent=text;
  box.appendChild(d);box.scrollTop=box.scrollHeight;
  if(box.children.length>60)box.removeChild(box.children[0]);
}

function setStatus(msg){document.getElementById('choices-inner').innerHTML=`<span id="status-txt">${msg}</span>`;}

function renderChoices(ch){
  const inner=document.getElementById('choices-inner');inner.innerHTML='';
  if(!ch||!ch.length){setStatus('[ No choices — refresh ]');return;}
  ch.forEach(c=>{const b=document.createElement('button');b.className='choice-btn';b.textContent=c;b.onclick=()=>onChoice(c,ch);inner.appendChild(b);});
}

function disableChoices(){document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);}

// ── Claude ─────────────────────────────────────────────────────────────
const SYS=`You are the warm, whimsical narrator of a cozy top-down RPG. Think RuneScape meets hobbit-core: rolling green hills, friendly villagers, curious woodland creatures, delicious food, gentle magic, small charming adventures. Tone: wholesome, witty, heartwarming.

Respond ONLY with valid JSON — no markdown fences, no extra text.

{
  "location": "meadow|village|forest|tavern|river",
  "narrative": ["line1","line2"],
  "event": "none|encounter|loot|rest|magic|gameover",
  "hpChange": 0, "xpGain": 0, "goldChange": 0, "itemGained": "",
  "choices": ["A) ...", "B) ...", "C) ..."]
}

Rules: location must be exactly one of the 5 options. 2-3 warm narrative lines. encounter: hpChange -2 to -4. loot: gold or item. rest: hpChange +4 to +8. gameover only if hp=0, gentle/funny. Always 3 choices. JSON ONLY.`;

async function callClaude(action){
  S.history.push({role:'user',content:`State:${JSON.stringify({hp:S.hp,maxHp:S.maxHp,xp:S.xp,gold:S.gold,inv:S.inv,scene:S.scene})}\nAction:${action}`});
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,system:SYS,messages:S.history})});
  if(!r.ok)throw new Error('API '+r.status);
  const data=await r.json();
  const raw=data.content.map(b=>b.text||'').join('');
  const parsed=JSON.parse(raw.replace(/```json|```/g,'').trim());
  S.history.push({role:'assistant',content:raw});
  if(S.history.length>18)S.history=S.history.slice(-14);
  return parsed;
}

async function onChoice(text,all){
  disableChoices();log('▸ '+text,'sys');setStatus('▸ Walking...');isWalking=true;
  try{
    const res=await callClaude(text);isWalking=false;
    if(res.hpChange)S.hp=Math.min(S.maxHp,Math.max(0,S.hp+res.hpChange));
    if(res.xpGain)S.xp+=res.xpGain;
    if(res.goldChange)S.gold=Math.max(0,S.gold+res.goldChange);
    if(res.itemGained&&S.inv.length<8)S.inv.push(res.itemGained);
    if(res.location)S.scene=res.location;
    updateStats();
    if(res.event==='loot'||res.event==='magic')sndPickup();
    else if(res.goldChange>0)sndCoin();
    else if(res.event==='rest')sndHeal();
    else if(res.event==='encounter'&&res.hpChange<0)sndBump();
    speak(res.narrative.join(' '));
    res.narrative.forEach((l,i)=>setTimeout(()=>log(l,res.event==='loot'?'good':res.event==='encounter'&&res.hpChange<0?'bad':''),i*400));
    const d=res.narrative.length*400+200;
    if(res.event==='gameover'){setTimeout(()=>{log('💤 You dozed off peacefully!','sys');document.getElementById('choices-inner').innerHTML='<button class="choice-btn" style="flex:none" onclick="startGame()">▸ WAKE UP & TRY AGAIN</button>';},d);return;}
    setTimeout(()=>renderChoices(res.choices),d);
  }catch(e){isWalking=false;console.error(e);log('[ The innkeeper spilled the tea — try again! ]','sys');renderChoices(all);}
}

async function startGame(){
  S.hp=20;S.maxHp=20;S.xp=0;S.gold=5;S.inv=[];S.history=[];S.scene='meadow';
  updateStats();document.getElementById('log-wrap').innerHTML='';setStatus('▸ Loading world...');
  try{
    const res=await callClaude('BEGIN GAME. Welcome the wanderer warmly. Cozy hobbit-core tone. Start in the meadow.');
    if(res.location)S.scene=res.location;updateStats();
    speak(res.narrative.join(' '));
    res.narrative.forEach((l,i)=>setTimeout(()=>log(l),i*500));
    setTimeout(()=>renderChoices(res.choices),res.narrative.length*500+200);
  }catch(e){console.error(e);setStatus('[ Could not reach the realm — retry ]');document.getElementById('choices-inner').innerHTML='<button class="choice-btn" style="flex:none" onclick="startGame()">▸ RETRY</button>';}
}

window.onload=()=>{
  resizeCanvas();window.addEventListener('resize',resizeCanvas);
  renderScene();updateStats();
  log('Welcome, Wanderer. ✦','sys');
  document.getElementById('choices-inner').innerHTML='<button class="choice-btn" style="flex:none" onclick="startGame()">▸ BEGIN YOUR ADVENTURE</button>';
};
</script>
