<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wanderer's Path</title>
<link rel="icon" href="favicon.ico">
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1208;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Press Start 2P',monospace;padding:8px;}
#wrap{width:100%;max-width:800px;border:3px solid #7a6030;box-shadow:0 0 40px #00000088;}
#topbar{background:#2a1e08;border-bottom:2px solid #7a6030;padding:5px 12px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
#gametitle{color:#e8c040;font-size:9px;letter-spacing:1px;text-shadow:2px 2px #000;}
.tbtn{background:none;border:1px solid #5a4020;color:#a08030;font-family:'Press Start 2P',monospace;font-size:7px;padding:3px 7px;cursor:pointer;white-space:nowrap;}
.tbtn:hover{border-color:#e8c040;color:#e8c040;}
#scene-wrap{position:relative;width:100%;line-height:0;}
#scene{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
#pause-overlay{display:none;position:fixed;inset:0;background:rgba(10,6,0,0.92);flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;}
#pause-overlay.show{display:flex;}
#pause-overlay h2{color:#e8c040;font-size:11px;letter-spacing:2px;text-shadow:0 0 12px #e8c04088;margin-bottom:8px;}
#pause-overlay p{color:#a08030;font-size:6px;letter-spacing:1px;margin-bottom:16px;}
.povbtn{background:#0e0c04;border:2px solid #7a6030;color:#c8a840;font-family:'Press Start 2P',monospace;font-size:8px;padding:8px 20px;cursor:pointer;min-width:180px;text-align:center;}
.povbtn:hover{border-color:#e8c040;color:#e8c040;background:#2a2008;}
#press-overlay p{color:#e8c040;font-size:9px;letter-spacing:2px;text-shadow:0 0 12px #e8c04088;white-space:nowrap;animation:blink 1.2s step-end infinite;}
@keyframes blink{50%{opacity:0;}}
#hud{position:absolute;top:6px;left:6px;background:#1a1208ee;border:2px solid #7a6030;padding:6px 8px;font-size:7px;color:#a08030;min-width:110px;}
.hr{display:flex;justify-content:space-between;margin-bottom:4px;gap:8px;}
.hv{color:#e8c040;}
.hb{background:#0a0800;border:1px solid #5a4020;height:6px;margin-bottom:5px;width:100%;}
.hbf{height:100%;transition:width 0.3s;}
#bhp{background:linear-gradient(90deg,#a01010,#e03020);}
#bxp{background:linear-gradient(90deg,#103090,#2050d0);}
#inv-bar{background:#1e1608;border-top:2px solid #5a4020;border-bottom:2px solid #5a4020;padding:5px 10px;display:flex;align-items:center;gap:4px;}
.ilbl{font-size:6px;color:#7a6030;margin-right:3px;}
.isl{background:#0e0c04;border:2px solid #5a4020;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative;}
.isl:hover{border-color:#e8c040;}.isl:hover .itip{display:block;}
.isl .itip{display:none;position:absolute;bottom:32px;left:50%;transform:translateX(-50%);background:#1a1208;border:1px solid #7a6030;color:#e8c040;font-size:6px;padding:3px 5px;white-space:nowrap;z-index:10;}
.isl.glow{border-color:#e8c040;box-shadow:0 0 8px #e8c04088;animation:invglow 1s ease-out forwards;}
@keyframes invglow{0%{border-color:#e8c040;box-shadow:0 0 12px #e8c040;}100%{border-color:#5a4020;box-shadow:none;}}
.ipag{background:none;border:1px solid #5a4020;color:#a08030;font-family:'Press Start 2P',monospace;font-size:8px;padding:2px 5px;cursor:pointer;line-height:1;}
.ipag:hover{border-color:#e8c040;color:#e8c040;}
#gld{margin-left:auto;font-size:8px;color:#e8c040;}
#log{background:#120e04;border-bottom:2px solid #5a4020;padding:10px 14px;height:220px;overflow-y:auto;}
#log::-webkit-scrollbar{width:3px;}
#log::-webkit-scrollbar-thumb{background:#5a4020;}
.ll{font-size:8px;line-height:1.9;color:#c8a840;margin-bottom:1px;}
.ll.dim{color:#606060;font-style:italic;}
#cbar{background:#1a1208;border-top:2px solid #5a4020;padding:6px 8px;min-height:52px;display:flex;align-items:center;}
#cinn{display:flex;flex-wrap:wrap;gap:5px;width:100%;}
.cb{background:#0e0c04;border:2px solid #5a402088;color:#c8a840;font-family:'Press Start 2P',monospace;font-size:7px;padding:5px 8px;cursor:pointer;flex:1;min-width:140px;text-align:left;line-height:1.6;}
.cb:hover{background:#2a2008;border-color:#e8c040;color:#e8c040;}
.cb:disabled{opacity:0.3;cursor:not-allowed;}
#stxt{color:#a08030;font-size:7px;}
</style>
</head>
<body>
<div id="credits-screen" style="display:none;position:fixed;inset:0;background:#0a0800;align-items:center;justify-content:center;z-index:2000;cursor:pointer;">
  <canvas id="credits-canvas"></canvas>
</div>
<div id="pause-overlay">
  <h2>⏸ PAUSED</h2>
  <p>You wandered away for a moment...</p>
  <button class="povbtn" onclick="resumeGame()">▸ RESUME</button>
  <button class="povbtn" style="margin-top:8px;border-color:#5a4020;color:#806020;" onclick="returnHome()">⌂ RETURN TO START</button>
</div>
<div id="press-overlay" style="display:flex;position:fixed;inset:0;background:rgba(10,6,0,0.96);flex-direction:column;align-items:center;justify-content:center;z-index:1000;gap:12px;" onclick="unlockAndStart()">
  <p><span style="font-size:14px;">▸</span> PRESS ANY KEY TO BEGIN</p>
  <div style="margin-top:16px;max-width:340px;text-align:center;color:#a08030;font-size:6px;line-height:2;letter-spacing:1px;padding:0 20px;">
    Explore the lands of Maplehaven. Talk to villagers, collect items, uncover secrets, and discover the mysteries of the kingdom...
  </div>
</div>
<div id="wrap">
  <div id="topbar">
    <span id="gametitle">✦ THE WANDERER'S PATH ✦</span>
    <div style="display:flex;gap:5px;">
      <button class="tbtn" id="sbtn" onclick="toggleSound()">♫ SOUND: OFF</button>
    </div>
  </div>
  <div id="scene-wrap">
    <canvas id="scene"></canvas>
    <div id="hud">
      <div class="hr">HP <span class="hv" id="hptx">20/20</span></div>
      <div class="hb"><div class="hbf" id="bhp" style="width:100%"></div></div>
      <div class="hr">XP <span class="hv" id="xptx">0</span></div>
      <div class="hb"><div class="hbf" id="bxp" style="width:0%"></div></div>
      <div class="hr">📍<span class="hv" id="loctx">the road</span></div>
    </div>
  </div>
  <div id="inv-bar">
    <span class="ilbl">INVENTORY</span>
    <button class="ipag" id="invprev" onclick="invPage(-1)">◀</button>
    <div id="islots" style="display:flex;gap:3px;"></div>
    <button class="ipag" id="invnext" onclick="invPage(1)">▶</button>
    <span id="gld">🟡 <span id="gtx">5</span> gold</span>
  </div>
  <div id="log"></div>
  <div id="cbar"><div id="cinn"><span id="stxt">▸ Loading...</span></div></div>
</div>
<script>
var PW=320,PH=180;
var BASE='https://amtrasi.github.io/wanderers-path/audio/';
var AMBIENT={
  village:BASE+'580150__dan_audiofile__birmingham-open-air-market.wav',
  river:  BASE+'222752__minian89__babbling_brook_loop.wav',
  tavern: BASE+'695295__brunoboselli__pirate-tavern.wav',
  forest: BASE+'427400__imjeax__forest-ambient-loop.wav',
  meadow: BASE+'752461__silverillusionist__windy-day-on-the-prairie-soundscape.wav'
};
var AVOL={village:0.15,river:0.12,tavern:0.18,forest:0.2,meadow:0.22};
var DOOR_URL =BASE+'460542__coosemek__door-creak.wav';
var MEOW_URL =BASE+'hazel-meow.m4a';
var LOBBY_URL=BASE+'649132__sonically_sound__medievalfantasy-rpg-loop-mix-at-32-secs-to-extendrepeat.wav';
var STEPS_URL=BASE+'816019__qubodup__fps-footsteps-loop.wav';
var BARD_URL =BASE+'769807__soundsandrebounds__shakespeare-lover-and-his-lass-lute-and-wood-flute.wav';

// ── State ──────────────────────────────────────────────────────────────
var S={hp:20,maxHp:20,xp:0,gold:5,inv:[],scene:'intro',flags:{},visited:{}};
var soundOn=false;
var invPage_=0; // current inventory page (4 slots per page)
var INV_PER_PAGE=4;

// ── Audio ──────────────────────────────────────────────────────────────
var actx=null;
function ac(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
function fadeVol(audio,from,to,dur,cb){
  var steps=40,iv=dur/steps,delta=(to-from)/steps,v=from,n=0;
  var t=setInterval(function(){v+=delta;n++;audio.volume=Math.max(0,Math.min(1,v));if(n>=steps){clearInterval(t);if(cb)cb();}},iv);
}
var amb=null,ambScene=null;
function setAmbient(scene){
  if(ambScene===scene)return;
  var url=AMBIENT[scene];if(!url)return;
  var old=amb,oldScene=ambScene;
  ambScene=scene;
  if(!soundOn){if(old){old.pause();old.src='';}amb=null;return;}
  // Fade out old
  if(old)fadeVol(old,old.volume,0,1800,function(){old.pause();old.src='';});
  // Fade in new — slight delay so crossfade overlaps
  var a=new Audio(url);a.loop=true;a.volume=0;
  a.play().catch(function(){});
  setTimeout(function(){fadeVol(a,0,AVOL[scene]||0.35,1800);},400);
  amb=a;
}
function stopAmbient(){if(amb){amb.pause();amb.src='';amb=null;ambScene=null;}}
var lobby=null;
function stopLobby(cb){
  if(!lobby){if(cb)cb();return;}
  var l=lobby;lobby=null;
  fadeVol(l,l.volume,0,800,function(){
    if(l){try{l.pause();l.src='';}catch(e){}}
    if(cb)cb();
  });
}
var bard=null;
function startBard(){
  if(bard||!soundOn)return;
  bard=new Audio(BARD_URL);bard.loop=true;bard.volume=0;bard.play().catch(function(){});fadeVol(bard,0,0.12,1500);
}
function stopBard(){if(!bard)return;var b=bard;bard=null;fadeVol(b,b.volume,0,1000,function(){b.pause();b.src='';});}
function tavernEnter(){
  stopAmbient();ambScene='tavern';
  if(!soundOn){var a=new Audio(AMBIENT.tavern);a.loop=true;a.volume=AVOL.tavern;amb=a;return;}
  new Audio(DOOR_URL).play().catch(function(){});
  var a=new Audio(AMBIENT.tavern);a.loop=true;a.volume=0;a.play().catch(function(){});
  setTimeout(function(){fadeVol(a,0,AVOL.tavern,1200);startBard();},1400);amb=a;
}
var steps_=null;
function startSteps(){if(steps_||!soundOn)return;steps_=new Audio(STEPS_URL);steps_.loop=true;steps_.volume=0.3;steps_.play().catch(function(){});}
function stopSteps(){if(steps_){steps_.pause();steps_.currentTime=0;steps_=null;}}
function tn(f,d,delay,vol,type){
  if(!soundOn)return;delay=delay||0;vol=vol||0.06;type=type||'sine';
  try{var ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);o.type=type;o.frequency.value=f;
  var t=ctx.currentTime+delay;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.03);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.start(t);o.stop(t+d+0.05);}catch(e){}
}
function sndPickup(){[523,659,784].forEach(function(f,i){tn(f,0.18,i*0.1);});}
function sndCoin(){tn(880,0.1);tn(1100,0.1,0.08);}
function sndHeal(){tn(528,0.35,0,0.05);}
function sndBump(){tn(220,0.12,0,0.05,'square');tn(180,0.14,0.09,0.04,'square');}
function sndBird(){
  if(!soundOn)return;
  [[0,900,1100],[0.15,1000,1300]].forEach(function(arr){
    try{var ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';
    var t=ctx.currentTime+arr[0];o.frequency.setValueAtTime(arr[1],t);o.frequency.linearRampToValueAtTime(arr[2],t+0.08);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.07,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+0.1);o.start(t);o.stop(t+0.12);}catch(e){}
  });
}
function playCatMeow(){
  if(!soundOn)return;
  try{var ctx=ac(),audio=new Audio(MEOW_URL);var src=ctx.createMediaElementSource(audio);var gain=ctx.createGain();gain.gain.value=0.4;src.connect(gain);gain.connect(ctx.destination);audio.play().catch(function(){});}
  catch(e){var a=new Audio(MEOW_URL);a.volume=0.3;a.play().catch(function(){});}
}
function toggleSound(){
  soundOn=!soundOn;document.getElementById('sbtn').textContent='♫ SOUND: '+(soundOn?'ON':'OFF');
  if(!soundOn){if(amb)amb.pause();if(steps_)steps_.pause();if(lobby)lobby.pause();if(bard)bard.pause();}
  else{if(amb)amb.play().catch(function(){});if(steps_)steps_.play().catch(function(){});if(lobby)lobby.play().catch(function(){});if(bard)bard.play().catch(function(){});}
}
function unlockAndStart(){
  var ov=document.getElementById('press-overlay');
  if(!ov||ov.style.display==='none')return; // already dismissed
  ov.style.display='none';
  soundOn=true;document.getElementById('sbtn').textContent='♫ SOUND: ON';
  lobby=new Audio(LOBBY_URL);lobby.loop=true;lobby.volume=0.5;lobby.play().catch(function(){});
}


// ── Character ──────────────────────────────────────────────────────────
var charX=160,charY=0.88,charScale=1,charState='idle',charDir=1;
var pendingCb=null,pendingScene=null,af=0;
// Cat sidekick — hide during scene transitions, reappear after
var catVisible=false,catX=120,catY=0,catHistory=[];
var catEntering=false,catEntryStep=0;
function showCat(){
  if(catVisible)return;catVisible=true;
  catX=Math.round(charX-20);catY=PH+20;catHistory=[];catEntering=true;catEntryStep=0;
}
function tickChar(){
  if(charState==='walkout'){
    charX+=2;
    if(charX>PW+20){S.scene=pendingScene;charX=-20;charState='walkin';
      // Reset cat to just behind entry point so it doesn't fly across
      if(catVisible){catX=-40;catY=Math.round(charY*PH);catHistory=[];}
    }
  }
  else if(charState==='walkin'){charX+=2;if(charX>=PW/2){charX=PW/2;charState='idle';stopSteps();if(pendingCb){var cb=pendingCb;pendingCb=null;cb();}}}
  else if(charState==='walkup'){charY-=0.003;charScale=Math.max(0.15,charScale-0.008);if(charScale<=0.18){charState='idle';if(pendingCb){var cb=pendingCb;pendingCb=null;cb();}}}
  if(catVisible){
    var targetX=charX-24;
    var targetY=Math.round(charY*PH);
    if(catEntering){
      catEntryStep++;
      // Slow walk upward from bottom — 0.4px per frame
      catY-=0.4;
      // Drift slightly toward player X
      catX+=(targetX-catX)*0.02;
      if(catY<=targetY){catY=targetY;catHistory=[];catEntering=false;}
    } else {
      catHistory.push({x:charX,y:Math.round(charY*PH)});
      if(catHistory.length>50)catHistory.shift();
      var tgt=catHistory[0]||{x:targetX,y:targetY};
      catX+=(tgt.x-24-catX)*0.12;catY+=(tgt.y-catY)*0.12;
    }
  }
}
function walkOut(newScene,cb){
  pendingScene=newScene;pendingCb=cb;charState='walkout';charDir=1;
  if(S.scene==='tavern')stopBard();
  if(newScene==='tavern')tavernEnter();else setAmbient(newScene);
  startSteps();
}
function walkUpToGate(cb){charState='walkup';charX=PW/2;charY=0.88;charScale=1;pendingCb=cb;startSteps();}

// ── Canvas ─────────────────────────────────────────────────────────────
var cv=document.getElementById('scene'),cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;
function resizeCanvas(){var w=document.getElementById('scene-wrap').clientWidth||780;cv.width=PW;cv.height=PH;cv.style.width=w+'px';cv.style.height=Math.round(w*(PH/PW))+'px';}

// ── Pixel helpers ──────────────────────────────────────────────────────
function rect(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(x,y,w,h);}
function dot(x,y,c){cx.fillStyle=c;cx.fillRect(x,y,1,1);}
function hline(x,y,w,c){cx.fillStyle=c;cx.fillRect(x,y,w,1);}
function vline(x,y,h,c){cx.fillStyle=c;cx.fillRect(x,y,1,h);}
function stoneTile(x,y,w,h,light,dark,shadow){
  light=light||'#9a9080';dark=dark||'#6a6058';shadow=shadow||'#4a4038';
  var hilight='rgba(255,255,255,0.18)';
  rect(x,y,w,h,shadow); // mortar/grout base
  var bh=7,bw=11;
  for(var row=0;row<Math.ceil(h/bh);row++){var off=(row%2)*6;
    for(var col=0;col<Math.ceil(w/bw)+1;col++){
      var bx=x+col*bw-off,by=y+row*bh;if(bx+bw<x||bx>x+w)continue;
      var cx2=Math.max(bx,x),cw2=Math.min(bx+bw-1,x+w)-cx2,ch=Math.min(bh-2,y+h-by);if(ch<=0||cw2<=0)continue;
      // stone face — mid tone
      rect(cx2,by,cw2,ch,dark);
      // top highlight strip
      hline(cx2,by,cw2,light);
      // left highlight
      vline(cx2,by,ch,light);
      // bottom shadow
      hline(cx2,by+ch-1,cw2,shadow);
      // right shadow
      vline(cx2+cw2-1,by,ch,shadow);
      // top-left bright corner pixel
      dot(cx2,by,hilight);
    }
  }
}
function cobblePath(x,y,w,h){
  rect(x,y,w,h,'#6a5838'); // dark mortar base
  [[0,0,12,7],[13,1,10,6],[24,0,14,7],[39,1,11,6],[51,0,13,7],[65,1,10,6],[76,0,14,7],[91,1,11,6],[103,0,13,7],[117,1,10,6],[128,0,14,7],[143,1,11,6],[155,0,13,7],[169,1,10,6],[180,0,14,7],[195,1,11,6],[0,8,14,7],[15,9,10,6],[26,8,13,7],[40,9,11,6],[52,8,12,7],[65,9,10,6],[76,8,14,7],[91,9,11,6],[103,8,13,7],[117,9,10,6],[128,8,14,7],[143,9,11,6],[155,8,13,7],[169,9,10,6],[180,8,14,7],[195,9,11,6]].forEach(function(p){
    var ax=x+(p[0]%(w||1)),ay=y+p[1];if(ax>x+w||ay>y+h)return;
    var fw=Math.min(p[2],x+w-ax),fh=Math.min(p[3],y+h-ay);
    if(fw<=0||fh<=0)return;
    rect(ax,ay,fw,fh,'#907858');   // stone face
    hline(ax,ay,fw,'#c8b080');     // top highlight
    vline(ax,ay,Math.min(2,fh),'#c0a870'); // left highlight
    hline(ax,ay+fh-1,fw,'#504028'); // bottom shadow
    vline(ax+fw-1,ay,fh,'#604830'); // right shadow
    dot(ax,ay,'#d8c090');           // bright top-left corner
  });
}
function pixelTree(x,y,sc){
  sc=sc||1;var s=Math.max(1,Math.round(sc)),tw=6*s,tx=x-tw/2;
  // Ground shadow
  cx.fillStyle='rgba(0,0,0,0.25)';cx.beginPath();cx.ellipse(x+3*s,y+3,9*s,3*s,0,0,Math.PI*2);cx.fill();
  // Trunk — 4 tones: darkest left, shadow, mid, highlight right
  rect(tx,y,1,24*s,'#0e0804');
  rect(tx+1,y,tw-3,24*s,'#3a1c08');
  rect(tx+2,y,Math.max(1,tw-5),22*s,'#5a3010');
  rect(tx+tw-2,y,2,20*s,'#7a4818');
  // Root flares at base for depth
  rect(tx-s,y+20*s,s,4*s,'#2a1408');
  rect(tx+tw,y+20*s,s,4*s,'#3a1c08');
  // ── Foliage: 5 layers of leaf clumps ──
  function leafClump(lx,ly,lw,lh,col){
    var hw=Math.floor(lw/2);
    for(var row=0;row<lh;row++){
      var b=Math.sin((row/lh)*Math.PI);
      var rw=Math.max(1,Math.round(lw*b));
      var jit=(row%3===0)?1:(row%3===1)?-1:0; // pixel jitter for leaf texture
      rect(lx-hw+Math.round((lw-rw)/2)+jit,ly+row,rw,1,col);
    }
  }
  // L1 darkest shadow (sides/bottom)
  leafClump(x-3*s,y-6*s,18*s,14*s,'#082808');
  leafClump(x+4*s,y-5*s,14*s,12*s,'#082808');
  leafClump(x-6*s,y-7*s,12*s,10*s,'#0a2a08');
  // L2 dark shadow
  leafClump(x,y-10*s,20*s,14*s,'#114010');
  leafClump(x-4*s,y-8*s,16*s,13*s,'#124212');
  leafClump(x+3*s,y-9*s,15*s,12*s,'#104010');
  // L3 midtone
  leafClump(x,y-15*s,18*s,13*s,'#1e6818');
  leafClump(x-3*s,y-13*s,15*s,11*s,'#227020');
  leafClump(x+2*s,y-14*s,14*s,11*s,'#1e6418');
  // L4 bright lit
  leafClump(x,y-20*s,14*s,10*s,'#38a028');
  leafClump(x-2*s,y-18*s,11*s,9*s,'#40b030');
  leafClump(x+2*s,y-19*s,10*s,8*s,'#3aa028');
  // L5 specular highlights (top only)
  leafClump(x,y-24*s,9*s,7*s,'#60d040');

// ── Pixel ground tile — fills an area with chunky 4x4 pixel tiles in 3 grass tones ──
function pixelGround(x,y,w,h,dark,mid,light){
  dark=dark||'#1a5008';mid=mid||'#226c10';light=light||'#2e8818';
  var ts=4; // tile size — conspicuous 4x4 pixels
  var pattern=[
    [mid,light,mid,dark],[dark,mid,light,mid],[mid,dark,mid,light],[light,mid,dark,mid]
  ];
  for(var ty=0;ty<Math.ceil(h/ts);ty++){
    for(var tx=0;tx<Math.ceil(w/ts);tx++){
      var px=x+tx*ts,py=y+ty*ts;
      var pw=Math.min(ts,x+w-px),ph=Math.min(ts,y+h-py);
      if(pw<=0||ph<=0)continue;
      rect(px,py,pw,ph,pattern[ty%4][tx%4]);

  var tips=['#48c020','#38a018','#58d028','#40b020','#30901a','#60d830','#38a018','#50c028'];
  for(var i=0;i<Math.ceil(w/2);i++){

    if(i%5===0)rect(x+i*2,y-1,1,1,'#60d830');
    if(i%7===0)rect(x+i*2+1,y-2,1,2,'#48c020');

}
function grassTufts(x,y,w,count){

}

function renderScene(){
  cx.imageSmoothingEnabled=false;
  drawScene(PW,PH);
  tickChar();
  var wf=charState!=='idle'?Math.floor(af/5)%4:0;
  var playerY=Math.round(charY*PH);
  // Collect drawable objects with Y positions for painter's sort
  var drawables=[];
  // Cat
  if(catVisible)drawables.push({y:catY,fn:function(){drawCat(catX,catY);}});
  // Player
  drawables.push({y:playerY,fn:function(){pixelPlayer(charX,playerY,wf,charScale);}});
  // NPCs per scene (drawn with painter's algorithm)
  var sc=S.scene;
  if(sc==='village'){
    // Sage: left of center, well above player Y (0.72) so painter sorts behind
    drawables.push({y:Math.round(PH*0.42),fn:function(){pixelNPC(PW*0.28,PH*0.42,'🧙');}});
    // Farmer: right side, slightly lower but still above player path
    drawables.push({y:Math.round(PH*0.46),fn:function(){pixelNPC(PW*0.72,PH*0.46,'👨‍🌾');}});
  } else if(sc==='meadow'){
    // Sage: far right, pushed back
    drawables.push({y:Math.round(PH*0.40),fn:function(){pixelNPC(PW*0.78,PH*0.40,'🧙');}});
    // Rabbit: far left
    drawables.push({y:Math.round(PH*0.42),fn:function(){pixelNPC(PW*0.18,PH*0.42,'🐇');}});
  } else if(sc==='forest'){
    // Fox: offset right so player walking center doesn't overlap
    drawables.push({y:Math.round(PH*0.40),fn:function(){pixelNPC(PW*0.68,PH*0.40,'🦊');}});
  } else if(sc==='tavern'){
    // Barkeep behind bar — y=0.54 so bar top at H*0.54 cuts through his waist
    drawables.push({y:Math.round(PH*0.54),fn:function(){drawBarkeep(Math.round(PW*0.22),Math.round(PH*0.54));}});
    // Bard — far right side, y=0.62 so he sits on the floor well below fireplace top
    drawables.push({y:Math.round(PH*0.62),fn:function(){drawBard(Math.round(PW*0.90),Math.round(PH*0.62));}});
  } else if(sc==='river'){
    // Duck: far right on water
    drawables.push({y:Math.round(PH*0.34),fn:function(){pixelNPC(PW*0.72,PH*0.34,'🦆');}});
  }
  // Sort by Y and draw
  drawables.sort(function(a,b){return a.y-b.y;});
  drawables.forEach(function(d){d.fn();});
  af++;requestAnimationFrame(renderScene);
}

var skipTypewriter=false;
function showSkipBtn(onSkip){
  var inn=document.getElementById('cinn');
  inn.innerHTML='<button class="cb" style="flex:none;opacity:0.7" onclick="skipNow()">▶▶ SKIP</button>';
  window._skipCb=onSkip;
}
function skipNow(){
  skipTypewriter=true;
  var btn=document.querySelector('#cinn .cb');if(btn&&btn.textContent==='▶▶ SKIP')btn.remove();
  if(window._skipCb){window._skipCb();window._skipCb=null;}
}
function hideSkipBtn(){
  skipTypewriter=false;window._skipCb=null;
  var btns=document.querySelectorAll('#cinn .cb');
  btns.forEach(function(b){if(b.textContent==='▶▶ SKIP')b.remove();});
}
function typewriterLog(text,cls,mpc,onDone){
  var b=document.getElementById('log'),d=document.createElement('div');
  d.className='ll'+(cls?' '+cls:'');d.textContent='';b.appendChild(d);
  mpc=mpc||30;
  if(skipTypewriter){d.textContent=text;b.scrollTop=b.scrollHeight;if(onDone)onDone();return;}
  var i=0;
  var iv=setInterval(function(){
    if(skipTypewriter){d.textContent=text;b.scrollTop=b.scrollHeight;clearInterval(iv);if(onDone)onDone();return;}
    d.textContent+=text[i++];b.scrollTop=b.scrollHeight;
    if(i>=text.length){clearInterval(iv);if(onDone)onDone();}
  },mpc);
}
function typewriterLines(lines,cls,onDone,triggers){
  skipTypewriter=false;triggers=triggers||{};var i=0;
  function next(){
    if(i>=lines.length){hideSkipBtn();if(onDone)onDone();return;}
    var idx=i,line=lines[i++];
    if(triggers[idx])setTimeout(triggers[idx],400);
    typewriterLog(line,cls,30,function(){setTimeout(next,120);});
  }
  showSkipBtn(function(){
    skipTypewriter=true;
    setTimeout(function(){
      var b=document.getElementById('log');
      while(i<lines.length){
        // Fire any triggers for remaining lines
        if(triggers[i])setTimeout(triggers[i],100);
        var d=document.createElement('div');d.className='ll'+(cls?' '+cls:'');
        d.textContent=lines[i++];b.appendChild(d);
      }
      b.scrollTop=b.scrollHeight;hideSkipBtn();if(onDone)onDone();
    },80);
  });
  next();
}

}

function buildTriggers(lines){
  var t={};
  lines.forEach(function(line,i){
    var l=line.toLowerCase();
    if(/\bcat\b|kitten|meow|purr/.test(l))t[i]=function(){playCatMeow();showCat();};
    if(/\bbird|chirp|sparrow|robin/.test(l))t[i]=sndBird;
  });
  return t;
}

  S.inv.push(item);

  updateStats();
  sndPickup();
}

function runNode(node){
  if(node.hpChange)S.hp=Math.min(S.maxHp,Math.max(0,S.hp+(node.hpChange||0)));
  if(node.xpGain)S.xp+=node.xpGain;
  if(node.goldChange)S.gold=Math.max(0,S.gold+(node.goldChange||0));
  if(node.unlocks)S.flags[node.unlocks]=true;
  updateStats();
  if(node.event==='loot'&&!node.itemGained)sndPickup();
  else if((node.goldChange||0)>0)sndCoin();
  else if(node.event==='rest')sndHeal();
  else if(node.event==='encounter'&&(node.hpChange||0)<0)sndBump();
  var cls=node.event==='loot'?'g':node.event==='encounter'&&(node.hpChange||0)<0?'b':'';
  var triggers=buildTriggers(node.lines);
  typewriterLines(node.lines,cls,function(){
    // Stat change lines — shown after story text
    var stats=[];
    if(node.hpChange&&node.hpChange>0)stats.push('+ '+node.hpChange+' HP restored');
    if(node.hpChange&&node.hpChange<0)stats.push(node.hpChange+' HP lost');
    if(node.xpGain&&node.xpGain>0)stats.push('+ '+node.xpGain+' XP gained');
    if(node.goldChange&&node.goldChange>0)stats.push('+ '+node.goldChange+' gold coins found');
    if(node.goldChange&&node.goldChange<0)stats.push(Math.abs(node.goldChange)+' gold coins spent');
    stats.forEach(function(s){logLine(s,'dim');});
    if(node.itemGained){
      addItem(node.itemGained);
      logLine('+ '+node.itemGained+' added to inventory','dim');
    }
    if(S.hp<=0){
      typewriterLog('💤 You collapse gently in the grass... what a journey!','s',30,function(){
        document.getElementById('cinn').innerHTML='<button class="cb" style="flex:none" onclick="startGame()">▸ WAKE UP & TRY AGAIN</button>';
      });return;
    }
    // Auto-trigger credits at end of epilogue — no choices shown
    if(node.epilogueEnd){
      document.getElementById('cinn').innerHTML='<span id="stxt">✦ The End...</span>';
      setTimeout(function(){showCredits();},2200);
      return;
    }
    // Show all allowed choices except the one we just came from (already done)
    var allAllowed=node.choices.filter(function(c){
      return !c.requires||S.flags[c.requires];
    });
    // Remove only the node we just visited (the current node itself)
    var avail=allAllowed.filter(function(c){
      return c.next!==_currentNodeId;
    });
    if(avail.length<1)avail=allAllowed;
    renderChoices(avail);
  },triggers);
}

function drawPixelGoldFrame(ctx, x, y, w, h) {
  var ps = 4; // pixel size
  var gold1='#e8c040', gold2='#f0d060', gold3='#a07010', gold4='#c8a020', dark='#5a3a00';
  // Fill frame background
  ctx.fillStyle = gold3;
  ctx.fillRect(x, y, w, h);
  // Inner lighter gold band
  ctx.fillStyle = gold1;
  ctx.fillRect(x+ps*2, y+ps*2, w-ps*4, h-ps*4);
  // Inner glow
  ctx.fillStyle = gold2;
  ctx.fillRect(x+ps*3, y+ps*3, w-ps*6, h-ps*6);
  // Pixel border — top row of bricks
  var brickW = ps*3, brickH = ps*2;
  for(var bx=x; bx<x+w; bx+=brickW) {
    // top edge alternating notches
    ctx.fillStyle = (Math.floor((bx-x)/brickW)%2===0) ? dark : gold4;
    ctx.fillRect(bx, y, Math.min(brickW, x+w-bx), brickH);
    // bottom edge
    ctx.fillStyle = (Math.floor((bx-x)/brickW)%2===0) ? dark : gold4;
    ctx.fillRect(bx, y+h-brickH, Math.min(brickW, x+w-bx), brickH);
  }
  for(var by=y; by<y+h; by+=brickH) {
    // left edge
    ctx.fillStyle = (Math.floor((by-y)/brickH)%2===0) ? dark : gold4;
    ctx.fillRect(x, by, brickW, Math.min(brickH, y+h-by));
    // right edge
    ctx.fillStyle = (Math.floor((by-y)/brickH)%2===0) ? dark : gold4;
    ctx.fillRect(x+w-brickW, by, brickW, Math.min(brickH, y+h-by));
  }
  // Corner accent squares
  [[x,y],[x+w-ps*4,y],[x,y+h-ps*4],[x+w-ps*4,y+h-ps*4]].forEach(function(c){
    ctx.fillStyle=gold2; ctx.fillRect(c[0],c[1],ps*4,ps*4);
    ctx.fillStyle=dark;  ctx.fillRect(c[0]+ps,c[1]+ps,ps*2,ps*2);
  });
  // Highlight top-left inner edge
  ctx.fillStyle='rgba(255,255,200,0.35)';
  ctx.fillRect(x+ps*3, y+ps*3, w-ps*6, ps);
  ctx.fillRect(x+ps*3, y+ps*3, ps, h-ps*6);
}

function showCredits(){
  stopAmbient(); stopBard(); stopSteps();
  if(lobby){lobby.pause();lobby=null;}

function runScrollingCredits(onDone){
  var ccv=document.getElementById('credits-canvas');
  var W=Math.min(window.innerWidth,600);
  var H=Math.min(window.innerHeight,520);
  ccv.width=W; ccv.height=H;
  ccv.style.width=W+'px'; ccv.style.height=H+'px';
  var ctx=ccv.getContext('2d');

  // Build list of rendered lines with heights
  var lineHeight=22, sectionGap=10;
  var entries=[];
  ATTRIBUTIONS.forEach(function(a){
    if(a.spacer){entries.push({type:'spacer',h:sectionGap});return;}
    if(a.isBig){entries.push({type:'big',text:a.title,h:32});return;}
    if(a.isHeader){entries.push({type:'header',text:a.title,sub:a.sub||null,h:a.sub?lineHeight+22:lineHeight+6});return;}
    if(a.isDim){entries.push({type:'dim',text:a.title,h:lineHeight});return;}
    entries.push({type:'attr',title:a.title,author:a.author,license:a.license,h:lineHeight*2+4});
  });

  var totalH=entries.reduce(function(s,e){return s+e.h;},0)+H;
  var scrollY=H; // start below screen
  var speed=0.6; // px per frame
  var done=false;
  var rafId=null;

  // Starfield (static, drawn once to offscreen)
  var stars=[];
  for(var s=0;s<80;s++)stars.push([Math.random()*W,Math.random()*H]);

  function draw(){
    ctx.clearRect(0,0,W,H);
    // bg
    var bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#070500');bg.addColorStop(1,'#120e04');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    // stars
    ctx.fillStyle='rgba(255,220,100,0.4)';
    stars.forEach(function(s){ctx.fillRect(s[0],s[1],1,1);});
    // fade top and bottom
    var fadeH=60;
    var topFade=ctx.createLinearGradient(0,0,0,fadeH);
    topFade.addColorStop(0,'rgba(7,5,0,1)');topFade.addColorStop(1,'rgba(7,5,0,0)');
    ctx.fillStyle=topFade;ctx.fillRect(0,0,W,fadeH);
    var botFade=ctx.createLinearGradient(0,H-fadeH,0,H);
    botFade.addColorStop(0,'rgba(7,5,0,0)');botFade.addColorStop(1,'rgba(7,5,0,1)');
    ctx.fillStyle=botFade;ctx.fillRect(0,H-fadeH,W,fadeH);

    // Draw entries
    var y=scrollY;
    entries.forEach(function(e){
      if(y+e.h>0 && y<H){
        ctx.save();
        ctx.textAlign='center';ctx.textBaseline='top';
        if(e.type==='big'){
          ctx.font="bold 11px 'Press Start 2P',monospace";
          ctx.fillStyle='#e8c040';ctx.shadowColor='#e8c040';ctx.shadowBlur=14;
          ctx.fillText(e.text,W/2,y);
        } else if(e.type==='header'){
          ctx.font="8px 'Press Start 2P',monospace";
          ctx.fillStyle='#c8a040';
          ctx.fillText(e.text,W/2,y+3);
          if(e.sub){
            ctx.font="6px 'Press Start 2P',monospace";
            ctx.fillStyle='#706040';
            ctx.fillText(e.sub,W/2,y+20);
          }
          // underline
          ctx.fillStyle='#5a4020';
          ctx.fillRect(W*0.2,y+e.h-2,W*0.6,1);
        } else if(e.type==='dim'){
          ctx.font="7px 'Press Start 2P',monospace";
          ctx.fillStyle='#706040';
          ctx.fillText(e.text,W/2,y+4);
        } else if(e.type==='attr'){
          ctx.font="7px 'Press Start 2P',monospace";
          ctx.fillStyle='#c8a840';
          ctx.fillText(e.title,W/2,y);
          ctx.font="6px 'Press Start 2P',monospace";
          ctx.fillStyle='#806030';
          ctx.fillText(e.author+(e.license?' · '+e.license:''),W/2,y+lineHeight);
        }
        ctx.restore();
      }
      y+=e.h;
    });

    scrollY-=speed;
    // Done when all content has scrolled past top
    if(scrollY < -(totalH-H) && !done){
      done=true;
      cancelAnimationFrame(rafId);
      setTimeout(onDone, 600);
      return;
    }
    rafId=requestAnimationFrame(draw);
  }

  // Allow click/tap to skip to end of scrolling credits
  var screen=document.getElementById('credits-screen');
  screen.onclick=function(){
    if(!done){done=true;cancelAnimationFrame(rafId);onDone();}
  };
  rafId=requestAnimationFrame(draw);
}

function runHazelScreen(onDone){
  var ccv=document.getElementById('credits-canvas');
  var W=Math.min(window.innerWidth,600);
  var H=Math.min(window.innerHeight,520);
  ccv.width=W; ccv.height=H;
  ccv.style.width=W+'px'; ccv.style.height=H+'px';
  var ctx=ccv.getContext('2d');
  ctx.imageSmoothingEnabled=false;
  var advanced=false;
  function advance(){if(!advanced){advanced=true;if(onDone)onDone();}}

  // Click to skip ahead to scrolling credits
  var screen=document.getElementById('credits-screen');
  screen.onclick=function(){advance();};

  // Draw background
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a0800');bg.addColorStop(1,'#1a1008');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  var stars=[];for(var s=0;s<60;s++)stars.push([Math.random()*W,Math.random()*H]);
  ctx.fillStyle='rgba(255,220,100,0.5)';
  stars.forEach(function(s){ctx.fillRect(s[0],s[1],1,1);});

  // Title
  ctx.fillStyle='#e8c040';
  ctx.font="bold 11px 'Press Start 2P',monospace";
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='#e8c040';ctx.shadowBlur=12;
  ctx.fillText('✦ THE WANDERER\'S PATH ✦',W/2,32);
  ctx.shadowBlur=0;

  // Image + frame
  var imgSize=Math.round(Math.min(W,H)*0.42);
  var frameMargin=18;
  var frameW=imgSize+frameMargin*2, frameH=imgSize+frameMargin*2;
  var frameX=Math.round(W/2-frameW/2), frameY=54;

  var img=new Image();
  img.onload=function(){
    drawPixelGoldFrame(ctx,frameX,frameY,frameW,frameH);
    ctx.save();ctx.beginPath();ctx.rect(frameX+frameMargin,frameY+frameMargin,imgSize,imgSize);ctx.clip();
    ctx.drawImage(img,frameX+frameMargin,frameY+frameMargin,imgSize,imgSize);
    ctx.restore();
    var ig=ctx.createRadialGradient(W/2,frameY+frameMargin+imgSize/2,imgSize*0.3,W/2,frameY+frameMargin+imgSize/2,imgSize*0.7);
    ig.addColorStop(0,'rgba(0,0,0,0)');ig.addColorStop(1,'rgba(0,0,0,0.3)');
    ctx.save();ctx.beginPath();ctx.rect(frameX+frameMargin,frameY+frameMargin,imgSize,imgSize);ctx.clip();
    ctx.fillStyle=ig;ctx.fillRect(frameX+frameMargin,frameY+frameMargin,imgSize,imgSize);ctx.restore();
    drawHazelText(ctx,W,H,frameY+frameH,advance);
  };
  img.onerror=function(){
    drawPixelGoldFrame(ctx,frameX,frameY,frameW,frameH);
    ctx.fillStyle='#2a1e08';ctx.fillRect(frameX+frameMargin,frameY+frameMargin,imgSize,imgSize);
    ctx.fillStyle='#e8c040';ctx.font="14px serif";ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🐱',W/2,frameY+frameMargin+imgSize/2);
    drawHazelText(ctx,W,H,frameY+frameH,advance);
  };
  img.src='assets/Hazel_end-credits.jpg';
}

function drawHazelText(ctx,W,H,belowY,onDone){
  var lines=[
    {text:'Hazel would like to say:',size:8,color:'#a08030',delay:400},
    {text:'Thank you for playing',size:10,color:'#e8c040',delay:900},
    {text:'The Wanderer\'s Path!',size:10,color:'#e8c040',delay:1400},
    {text:'♪  ♦  ♪',size:9,color:'#806020',delay:2000},
  ];
  var yStart=belowY+18;
  lines.forEach(function(l,i){
    setTimeout(function(){
      ctx.save();
      ctx.font=l.size+"px 'Press Start 2P',monospace";
      ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillStyle=l.color;
      if(l.color==='#e8c040'){ctx.shadowColor='#e8c040';ctx.shadowBlur=8;}
      ctx.fillText(l.text,W/2,yStart+i*22);
      ctx.shadowBlur=0;ctx.restore();
    },l.delay);
  });
  // Show scroll hint, then auto-advance after 6 seconds of reading time
  setTimeout(function(){
    ctx.save();
    ctx.font="6px 'Press Start 2P',monospace";
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillStyle='#604810';
    ctx.fillText('[ continuing... ]',W/2,yStart+lines.length*22);
    ctx.restore();
  },2400);
  setTimeout(function(){if(onDone)onDone();},7000);
}


var _currentNodeId=null;
function goToNode(nodeId){
  if(nodeId==='_credits_'){showCredits();return;}
  var node=STORY[nodeId];if(!node){logLine('[The path ends here...]','s');return;}
  _currentNodeId=nodeId;
  // Use revisit text if already visited and revisit lines exist
  var isRevisit=S.visited[nodeId]&&node.revisit;
  // For loot nodes with no revisit text, block re-collecting by skipping loot effects
  var isLootRevisit=S.visited[nodeId]&&node.itemGained&&!node.revisit;
  S.visited[nodeId]=true;
  var displayNode;
  if(isLootRevisit){
    // Show a neutral "nothing more here" message instead
    displayNode=Object.assign({},node,{
      lines:["You search around but find nothing new here."],
      event:'none',itemGained:null,xpGain:0,goldChange:0,hpChange:0,revisit:null
    });
  } else if(isRevisit){
    displayNode=Object.assign({},node,{lines:node.revisit,event:'none',itemGained:null,xpGain:0,goldChange:0,hpChange:0});
  } else {
    displayNode=node;
  }
  if(node.scene===S.scene){runNode(displayNode);return;}
  setSt('▸ Walking...');
  walkOut(node.scene,function(){S.scene=node.scene;updateStats();runNode(displayNode);});
}
function onChoice(nextId){disableCh();goToNode(nextId);}

  stopLobby(function(){
    skipTypewriter=false;window._skipCb=null;
    S={hp:20,maxHp:20,xp:0,gold:5,inv:[],scene:'intro',flags:{},visited:{}};
    invPage_=0;catVisible=false;catHistory=[];catX=160;catY=Math.round(0.72*PH);
    charX=PW/2;charY=0.88;charScale=1;charState='idle';pendingCb=null;
    updateStats();document.getElementById('log').innerHTML='';
    logLine('You approach the gates of Maplehaven...','s');
    setAmbient('village');
    document.getElementById('cinn').innerHTML='<span id="stxt">▸ Walking...</span>';
    walkUpToGate(function(){
        stopSteps();S.scene='village';charX=-20;charY=0.72;charScale=1;charState='walkin';startSteps();

    });

window.onload=function(){
  resizeCanvas();window.addEventListener('resize',resizeCanvas);
  renderScene();updateStats();logLine('Welcome, Wanderer. ✦','s');
  document.addEventListener('keydown',function onKey(){unlockAndStart();document.removeEventListener('keydown',onKey);});
  document.getElementById('cinn').innerHTML='<button class="cb" style="flex:none" onclick="startGame()">▸ BEGIN YOUR ADVENTURE</button>';
  // Pause all audio when tab is hidden, resume only if soundOn
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){
      if(lobby)lobby.pause();
      if(amb)amb.pause();
      if(bard)bard.pause();
      if(steps_)steps_.pause();
      // Only show pause overlay if game has started (not on title screen)
      if(S.scene!=='intro')document.getElementById('pause-overlay').classList.add('show');
    } else {
      // Don't auto-resume — let user click Resume
    }
  });
};
