<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wanderer's Path</title>
<link rel="icon" href="favicon.ico">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#1a1208;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Press Start 2P',monospace;padding:8px;}
  #wrap{width:100%;max-width:800px;border:3px solid #7a6030;box-shadow:0 0 40px #00000088;}
  #topbar{background:#2a1e08;border-bottom:2px solid #7a6030;padding:5px 12px;display:flex;justify-content:space-between;align-items:center;}
  #title{color:#e8c040;font-size:9px;letter-spacing:1px;text-shadow:2px 2px #000;}
  .tbtn{background:none;border:1px solid #5a4020;color:#a08030;font-family:'Press Start 2P',monospace;font-size:7px;padding:3px 7px;cursor:pointer;}
  .tbtn:hover{border-color:#e8c040;color:#e8c040;}
  #scene-wrap{position:relative;width:100%;line-height:0;}
  #scene{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
  #hud{position:absolute;top:6px;left:6px;background:#1a1208ee;border:2px solid #7a6030;padding:6px 8px;font-size:7px;color:#a08030;min-width:110px;}
  .hr{display:flex;justify-content:space-between;margin-bottom:4px;gap:8px;}
  .hv{color:#e8c040;}
  .hb{background:#0a0800;border:1px solid #5a4020;height:6px;margin-bottom:5px;width:100%;}
  .hbf{height:100%;transition:width 0.3s;}
  #bhp{background:linear-gradient(90deg,#a01010,#e03020);}
  #bxp{background:linear-gradient(90deg,#103090,#2050d0);}
  #inv-bar{background:#1e1608;border-top:2px solid #5a4020;border-bottom:2px solid #5a4020;padding:5px 10px;display:flex;align-items:center;gap:4px;}
  .ilbl{font-size:6px;color:#7a6030;margin-right:3px;}
  .isl{background:#0e0c04;border:2px solid #5a4020;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .isl:hover{border-color:#e8c040;}
  #gld{margin-left:auto;font-size:8px;color:#e8c040;}
  #log{background:#120e04;border-bottom:2px solid #5a4020;padding:10px 14px;min-height:180px;max-height:260px;overflow-y:auto;}
  #log::-webkit-scrollbar{width:3px;}
  #log::-webkit-scrollbar-thumb{background:#5a4020;}
  .ll{font-size:8px;line-height:1.9;color:#c8a840;margin-bottom:1px;}
  .ll.g{color:#60b840;}.ll.b{color:#c04030;}.ll.s{color:#e8c040;}
  #cbar{background:#1a1208;border-top:2px solid #5a4020;padding:6px 8px;min-height:52px;display:flex;align-items:center;}
  #cinn{display:flex;flex-wrap:wrap;gap:5px;width:100%;}
  .cb{background:#0e0c04;border:2px solid #5a402088;color:#c8a840;font-family:'Press Start 2P',monospace;font-size:7px;padding:5px 8px;cursor:pointer;flex:1;min-width:140px;text-align:left;line-height:1.6;}
  .cb:hover{background:#2a2008;border-color:#e8c040;color:#e8c040;}
  .cb:disabled{opacity:0.3;cursor:not-allowed;}
  #stxt{color:#a08030;font-size:7px;}
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <span id="title">✦ THE WANDERER'S PATH ✦</span>
    <button class="tbtn" id="vbtn" onclick="toggleVoice()">♪ VOICE: ON</button>
  </div>
  <div id="scene-wrap">
    <canvas id="scene"></canvas>
    <div id="hud">
      <div class="hr">HP <span class="hv" id="hptx">20/20</span></div>
      <div class="hb"><div class="hbf" id="bhp" style="width:100%"></div></div>
      <div class="hr">XP <span class="hv" id="xptx">0</span></div>
      <div class="hb"><div class="hbf" id="bxp" style="width:0%"></div></div>
      <div class="hr">📍<span class="hv" id="loctx">???</span></div>
    </div>
  </div>
  <div id="inv-bar">
    <span class="ilbl">INVENTORY</span>
    <div id="islots" style="display:flex;gap:3px;"></div>
    <span id="gld">⬡ <span id="gtx">5</span></span>
  </div>
  <div id="log"></div>
  <div id="cbar"><div id="cinn"><span id="stxt">▸ Loading...</span></div></div>
</div>
<script>
// ── Constants & URLs ───────────────────────────────────────────────────
const PW=320, PH=180;
const BASE='https://amtrasi.github.io/wanderers-path/audio/';
const AMBIENT_URLS={
  village: BASE+'580150__dan_audiofile__birmingham-open-air-market.wav',
  river:   BASE+'222752__minian89__babbling_brook_loop.wav',
  tavern:  BASE+'695295__brunoboselli__pirate-tavern.wav',
  forest:  BASE+'427400__imjeax__forest-ambient-loop.wav',
  meadow:  BASE+'752461__silverillusionist__windy-day-on-the-prairie-soundscape.wav',
};
const DOOR_URL  = BASE+'460542__coosemek__door-creak.wav';
const MEOW_URL  = BASE+'528197__fthgurdy__cat-meow-1.wav';
const LOBBY_URL = BASE+'649132__sonically_sound__medievalfantasy-rpg-loop-mix-at-32-secs-to-extendrepeat.flac';
const STEPS_URL = BASE+'816019__qubodup__fps-footsteps-loop.wav';
const XI_KEY    = 'sk_ba08c6246de3fc999a143a77c6c31601acb3dac580a14f26';
const XI_VOICE  = 'N2lVS1w4EtoT3dr4eOWO';

// ── Game state ─────────────────────────────────────────────────────────
const S={hp:20,maxHp:20,xp:0,gold:5,inv:[],scene:'intro'};

// ── Audio helpers ──────────────────────────────────────────────────────
let actx=null;
function ac(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}

function fadeAudio(audio,from,to,dur,onDone){
  const steps=40,iv=dur/steps,delta=(to-from)/steps;
  let v=from,n=0;
  const t=setInterval(()=>{
    v+=delta;n++;
    audio.volume=Math.max(0,Math.min(1,v));
    if(n>=steps){clearInterval(t);if(onDone)onDone();}
  },iv);
}

// Ambient
let ambientAudio=null,ambientScene=null;
function playAmbient(scene){
  if(ambientScene===scene)return;
  if(ambientAudio){const o=ambientAudio;fadeAudio(o,o.volume,0,1200,()=>{o.pause();o.src='';});}
  const url=AMBIENT_URLS[scene];if(!url)return;
  const a=new Audio(url);a.loop=true;a.volume=0;a.play().catch(()=>{});
  fadeAudio(a,0,0.35,1200);
  ambientAudio=a;ambientScene=scene;
}

// Lobby music
let lobbyMusic=null;
function startLobbyMusic(){
  if(lobbyMusic)return;
  lobbyMusic=new Audio(LOBBY_URL);
  lobbyMusic.loop=true;lobbyMusic.volume=0.5;
  lobbyMusic.play().catch(()=>{});
}
function stopLobbyMusic(){
  if(!lobbyMusic)return;
  const o=lobbyMusic;lobbyMusic=null;
  fadeAudio(o,o.volume,0,1000,()=>{o.pause();o.src='';});
}

// Tavern door + fade
function playDoorAndEnterTavern(){
  const door=new Audio(DOOR_URL);door.volume=0.9;door.play().catch(()=>{});
  if(ambientAudio){const o=ambientAudio;fadeAudio(o,o.volume,0,400,()=>{o.pause();o.src='';});}
  const a=new Audio(AMBIENT_URLS.tavern);a.loop=true;a.volume=0;a.play().catch(()=>{});
  setTimeout(()=>fadeAudio(a,0,0.35,1200),1200);
  ambientAudio=a;ambientScene='tavern';
}

// Cat meow (amplified)
function playCatMeow(){
  try{
    const ctx=ac();
    const audio=new Audio(MEOW_URL);
    const src=ctx.createMediaElementSource(audio);
    const gain=ctx.createGain();gain.gain.value=3.5;
    src.connect(gain);gain.connect(ctx.destination);
    audio.play().catch(()=>{});
  }catch(e){var a=new Audio(MEOW_URL);a.volume=1.0;a.play().catch(function(){});}
}

// Footsteps
let footstepAudio=null;
function startFootsteps(){
  if(footstepAudio)return;
  footstepAudio=new Audio(STEPS_URL);
  footstepAudio.loop=true;footstepAudio.volume=0.5;
  footstepAudio.play().catch(()=>{});
}
function stopFootsteps(){
  if(footstepAudio){footstepAudio.pause();footstepAudio.currentTime=0;footstepAudio=null;}
}

// Synth sounds
function tn(freq,dur,delay,vol,type){
  delay=delay||0;vol=vol||0.06;type=type||'sine';
  try{const ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);o.type=type;o.frequency.value=freq;
  const t=ctx.currentTime+delay;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.03);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t);o.stop(t+dur+0.05);}catch(e){}
}
function sndPickup(){[523,659,784].forEach(function(f,i){tn(f,0.18,i*0.1);});}
function sndCoin(){tn(880,0.1);tn(1100,0.1,0.08);}
function sndHeal(){tn(528,0.35,0,0.05);}
function sndBump(){tn(220,0.12,0,0.05,'square');tn(180,0.14,0.09,0.04,'square');}
function sndBird(){
  [[0,900,1100],[0.15,1000,1300]].forEach(function(arr){
    var d=arr[0],f1=arr[1],f2=arr[2];
    try{var ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);o.type='sine';
    var t=ctx.currentTime+d;
    o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+0.08);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.07,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
    o.start(t);o.stop(t+0.12);}catch(e){}
  });
}

function narrativeSounds(lines){
  var t=lines.join(' ').toLowerCase();
  if(/\bcat\b|kitten|meow|purr/.test(t))setTimeout(playCatMeow,400);
  if(/\bbird|chirp|sparrow|robin/.test(t))setTimeout(sndBird,400);
}

// ── TTS ────────────────────────────────────────────────────────────────
let voiceOn=true,curAudio=null;
async function speak(text){
  if(!voiceOn)return;
  if(curAudio){curAudio.pause();curAudio=null;}
  try{
    const r=await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+XI_VOICE,{
      method:'POST',
      headers:{'xi-api-key':XI_KEY,'Content-Type':'application/json','Accept':'audio/mpeg'},
      body:JSON.stringify({text,model_id:'eleven_turbo_v2',voice_settings:{stability:0.4,similarity_boost:0.75,style:0.55,use_speaker_boost:true}})
    });
    if(!r.ok)return;
    curAudio=new Audio(URL.createObjectURL(await r.blob()));
    curAudio.play().catch(()=>{});
  }catch(e){}
}
function toggleVoice(){
  voiceOn=!voiceOn;
  if(!voiceOn&&curAudio){curAudio.pause();curAudio=null;}
  document.getElementById('vbtn').textContent='♪ VOICE: '+(voiceOn?'ON':'OFF');
}

// ── Character animation ────────────────────────────────────────────────
let charX=160,charState='idle',charDir=1;
let pendingScene=null,pendingCallback=null;

function animateWalkOut(newScene,cb){
  pendingScene=newScene;pendingCallback=cb;
  charState='walkout';charDir=1;
  if(newScene==='tavern'){
    setTimeout(playDoorAndEnterTavern,300);
  }else{
    playAmbient(newScene);
  }
  startFootsteps();
}
function tickChar(){
  if(charState==='walkout'){
    charX+=2;
    if(charX>PW+20){S.scene=pendingScene;charX=-20;charState='walkin';}
  }else if(charState==='walkin'){
    charX+=2;
    if(charX>=PW/2){charX=PW/2;charState='idle';stopFootsteps();if(pendingCallback){pendingCallback();pendingCallback=null;}}
  }
}

// ── Canvas ─────────────────────────────────────────────────────────────
const cv=document.getElementById('scene'),cx=cv.getContext('2d');
cx.imageSmoothingEnabled=false;
let af=0;

function resizeCanvas(){
  const w=document.getElementById('scene-wrap').clientWidth||780;
  cv.width=PW;cv.height=PH;
  cv.style.width=w+'px';cv.style.height=Math.round(w*(PH/PW))+'px';
}

// ── Pixel helpers ──────────────────────────────────────────────────────
function rect(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(x,y,w,h);}
function dot(x,y,c){cx.fillStyle=c;cx.fillRect(x,y,1,1);}
function hline(x,y,w,c){cx.fillStyle=c;cx.fillRect(x,y,w,1);}
function vline(x,y,h,c){cx.fillStyle=c;cx.fillRect(x,y,1,h);}

function stoneTile(x,y,w,h,light,dark,shadow){
  light=light||'#9a9080';dark=dark||'#6a6058';shadow=shadow||'#4a4038';
  rect(x,y,w,h,dark);
  var bh=6,bw=10;
  for(var row=0;row<Math.ceil(h/bh);row++){
    var off=(row%2)*5;
    for(var col=0;col<Math.ceil(w/bw)+1;col++){
      var bx=x+col*bw-off,by=y+row*bh;
      if(bx+bw<x||bx>x+w)continue;
      var cx2=Math.max(bx,x),cw=Math.min(bx+bw,x+w)-cx2,ch=Math.min(bh-1,y+h-by);
      if(ch<=0)continue;
      rect(cx2,by,cw,ch,light);hline(cx2,by+ch-1,cw,shadow);vline(cx2+cw-1,by,ch,shadow);
    }
  }
}

function cobblePath(x,y,w,h){
  rect(x,y,w,h,'#8a7850');
  var pat=[[0,0,12,7],[13,1,10,6],[24,0,14,7],[39,1,11,6],[51,0,13,7],[65,1,10,6],[76,0,14,7],[91,1,11,6],[103,0,13,7],[117,1,10,6],[128,0,14,7],[143,1,11,6],[155,0,13,7],[169,1,10,6],[180,0,14,7],[195,1,11,6],[207,0,13,7],[221,1,10,6],[232,0,14,7],[247,1,11,6],[259,0,13,7],[273,1,10,6],[285,0,14,7],[300,1,11,6],[0,8,14,7],[15,9,10,6],[26,8,13,7],[40,9,11,6],[52,8,12,7],[65,9,10,6],[76,8,14,7],[91,9,11,6],[103,8,13,7],[117,9,10,6],[128,8,14,7],[143,9,11,6],[155,8,13,7],[169,9,10,6],[180,8,14,7],[195,9,11,6],[207,8,13,7],[221,9,10,6],[232,8,14,7],[247,9,11,6],[259,8,13,7],[273,9,10,6],[285,8,14,7],[300,9,11,6]];
  pat.forEach(function(p){var ax=x+(p[0]%(w||1)),ay=y+p[1];if(ax>x+w||ay>y+h)return;var fw=Math.min(p[2],x+w-ax),fh=Math.min(p[3],y+h-ay);rect(ax,ay,fw,fh,'#b0986a');hline(ax,ay,fw,'#c8ae82');vline(ax,ay,fh,'#c8ae82');hline(ax,ay+fh-1,fw,'#786040');vline(ax+fw-1,ay,fh,'#786040');});
}

function pixelTree(x,y,sc){
  sc=sc||1;var s=Math.max(1,Math.round(sc)),tw=6*s,tx=x-tw/2;
  rect(tx,y,tw,24*s,'#5a3010');rect(tx+1,y,tw-2,24*s,'#7a4818');
  rect(tx-3,y+20*s,4,4,'#5a3010');rect(tx+tw-1,y+20*s,4,4,'#5a3010');
  [[x,y-10*s,18*s,14*s,'#1a3808'],[x-4*s,y-6*s,14*s,12*s,'#224a0a'],[x+2*s,y-8*s,16*s,13*s,'#1e4208'],[x-2*s,y-14*s,16*s,12*s,'#2a5a0c'],[x,y-18*s,12*s,10*s,'#347010'],[x-1*s,y-20*s,10*s,8*s,'#408018'],[x+1*s,y-22*s,8*s,7*s,'#4a9020'],[x-3*s,y-16*s,5*s,5*s,'#5aa828'],[x+2*s,y-19*s,4*s,4*s,'#62b02e']].forEach(function(l){var hw=Math.floor(l[2]/2);for(var row=0;row<l[3];row++){var b=Math.sin((row/l[3])*Math.PI),rw=Math.max(1,Math.round(l[2]*b));rect(l[0]-hw+Math.round((l[2]-rw)/2),l[1]+row,rw,1,l[4]);}});
}

function pixelBush(x,y,c1,c2,c3){
  c1=c1||'#2a5010';c2=c2||'#3a6818';c3=c3||'#4a8020';
  rect(x-6,y-4,12,6,c1);rect(x-4,y-6,8,4,c2);rect(x-2,y-7,5,3,c3);rect(x-7,y-3,4,4,c2);rect(x+3,y-4,4,4,c2);
}

function stoneArch(x,y,w,h){
  stoneTile(x,y,8,h,'#9a9080','#7a7068','#5a5048');stoneTile(x+w-8,y,8,h,'#9a9080','#7a7068','#5a5048');
  var cy2=y+h;
  for(var i=0;i<w-16;i++){var t=(i/(w-16))*Math.PI,ay=cy2-Math.round(Math.sin(t)*(h*0.7));rect(x+8+i,ay,1,cy2-ay,'#7a7068');}
}

function pixelHouse(x,y,w,h){
  w=w||50;h=h||40;
  stoneTile(x,y+Math.round(h*0.3),w,Math.round(h*0.7));
  var rh=Math.round(h*0.4);
  for(var row=0;row<rh;row++){var sh=row/rh;rect(x+row,y+row,w-row*2,1,'rgb('+Math.round(160-sh*60)+','+Math.round(60-sh*20)+',10)');}
  rect(x+8,y+Math.round(h*0.45),10,8,'#1a2030');hline(x+8,y+Math.round(h*0.45),10,'#a09070');
  rect(x+Math.round(w*0.4),y+Math.round(h*0.65),Math.round(w*0.2),Math.round(h*0.35),'#3a1c08');
}

function pixelWater(x,y,w,h){
  var t=Date.now()/800;
  for(var row=0;row<h;row++){var d=row/h;rect(x,y+row,w,1,'rgb('+Math.round(20+d*10)+','+Math.round(60+d*20)+','+Math.round(120+d*30)+')');}
  for(var i=0;i<5;i++){var rx=(i*65+Math.floor(t*20))%w;rect(x+rx,y+Math.round(h*0.3),20,1,'rgba(180,220,255,0.25)');rect(x+rx+8,y+Math.round(h*0.6),12,1,'rgba(180,220,255,0.2)');}
}

function pixelNPC(x,y,emoji){
  cx.save();cx.globalAlpha=0.3;cx.fillStyle='#e8d060';cx.beginPath();cx.arc(x,y,10,0,Math.PI*2);cx.fill();cx.restore();
  cx.font='14px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(emoji,x,y);
}

function pixelPlayer(px,py,frame,dir){
  dir=dir||1;
  cx.save();if(dir===-1){cx.translate(Math.round(px)*2,0);cx.scale(-1,1);}
  var tmp=document.createElement('canvas');tmp.width=32;tmp.height=48;
  var t=tmp.getContext('2d');t.imageSmoothingEnabled=false;
  var skin='#8B5E3C',hair='#1a0e00',tunic='#c03060',legs='#5a3472',boot='#2a1800',gold='#e8a020';
  var legA=frame===1?2:frame===3?-2:0,legB=frame===1?-2:frame===3?2:0,bob=(frame===1||frame===3)?1:0;
  function r(x,y,w,h,c){t.fillStyle=c;t.fillRect(x,y,w,h);}
  function d(x,y,c){t.fillStyle=c;t.fillRect(x,y,1,1);}
  r(5,6,4,28,hair);r(3,8,3,10,hair);r(4,18,3,8,hair);r(6,26,3,8,hair);r(4,34,4,6,hair);
  d(3,10,hair);d(2,13,hair);d(3,16,hair);d(2,19,hair);d(3,22,hair);d(2,25,hair);d(3,28,hair);d(4,32,hair);
  r(23,6,4,28,hair);r(26,8,3,10,hair);r(25,18,3,8,hair);r(23,26,3,8,hair);r(24,34,4,6,hair);
  d(28,10,hair);d(29,13,hair);d(28,16,hair);d(29,19,hair);d(28,22,hair);d(29,25,hair);d(28,28,hair);d(27,32,hair);
  r(7,2,18,5,hair);d(7,1,hair);d(10,0,hair);d(14,1,hair);d(18,0,hair);d(22,1,hair);d(24,1,hair);
  r(8,4,16,12,skin);
  r(11,8,3,2,'#1a0800');r(18,8,3,2,'#1a0800');
  d(12,7,'rgba(255,255,255,0.85)');d(19,7,'rgba(255,255,255,0.85)');
  d(12,12,'#6a3010');d(13,13,'#6a3010');d(14,13,'#6a3010');d(15,13,'#6a3010');
  d(16,13,'#6a3010');d(17,13,'#6a3010');d(18,13,'#6a3010');d(19,12,'#6a3010');
  d(8,10,gold);d(23,10,gold);
  r(13,16+bob,6,3,skin);r(8,18+bob,16,8,tunic);
  r(5,18+bob,4,9,'#801840');r(23,18+bob,4,9,'#801840');
  r(4,18+legB+bob,5,7,skin);r(23,18+legA+bob,5,7,skin);
  r(8,25+bob,16,2,gold);r(6,26+bob,20,5,tunic);
  r(9+legB,30+bob,6,7,legs);r(17+legA,30+bob,6,7,legs);
  r(8+legB,36+bob,7,4,boot);r(17+legA,36+bob,7,4,boot);
  r(26,18+bob,3,10,'#909090');r(24,18+bob,7,3,gold);
  cx.drawImage(tmp,Math.round(px)-16,Math.round(py)-40);cx.restore();
}

// ── Scenes ─────────────────────────────────────────────────────────────

function renderScene(){
  cx.imageSmoothingEnabled=false;
  var draw=SCENES[S.scene]||SCENES.village;
  draw(PW,PH);
  tickChar();
  var wf=charState!=='idle'?Math.floor(af/5)%4:0;
  pixelPlayer(charX,PH*0.72,wf,charDir);
  af++;requestAnimationFrame(renderScene);
}

function log(text,cls){
  var b=document.getElementById('log'),d=document.createElement('div');
  d.className='ll'+(cls?' '+cls:'');d.textContent=text;
  b.appendChild(d);b.scrollTop=b.scrollHeight;
  if(b.children.length>80)b.removeChild(b.children[0]);
}

var skipTypewriter=false;

function showSkipBtn(onSkip){
  var inn=document.getElementById('cinn');
  inn.innerHTML='<button class="cb" style="flex:none;opacity:0.7" id="skipbtn" onclick="skipNow()">▶▶ SKIP</button>';
  window._skipCb=onSkip;
}
function skipNow(){
  skipTypewriter=true;
  var btn=document.getElementById('skipbtn');if(btn)btn.remove();
  if(window._skipCb){window._skipCb();window._skipCb=null;}
}
function hideSkipBtn(){
  skipTypewriter=false;
  var btn=document.getElementById('skipbtn');if(btn)btn.remove();
}

function typewriterLog(text,cls,onDone){
  var b=document.getElementById('log'),d=document.createElement('div');
  d.className='ll'+(cls?' '+cls:'');d.textContent='';b.appendChild(d);
  if(skipTypewriter){d.textContent=text;b.scrollTop=b.scrollHeight;if(onDone)onDone();return;}
  var i=0;
  var iv=setInterval(function(){
    if(skipTypewriter){d.textContent=text;b.scrollTop=b.scrollHeight;clearInterval(iv);if(onDone)onDone();return;}
    d.textContent+=text[i++];b.scrollTop=b.scrollHeight;
    if(i>=text.length){clearInterval(iv);if(onDone)onDone();}
  },28);
}

function typewriterLines(lines,cls,onDone){
  skipTypewriter=false;
  var i=0;
  function next(){
    if(i>=lines.length){hideSkipBtn();if(onDone)onDone();return;}
    typewriterLog(lines[i++],cls,function(){setTimeout(next,120);});
  }
  showSkipBtn(function(){
    skipTypewriter=true;
    setTimeout(function(){
      var b=document.getElementById('log');
      while(i<lines.length){var d=document.createElement('div');d.className='ll'+(cls?' '+cls:'');d.textContent=lines[i++];b.appendChild(d);}
      b.scrollTop=b.scrollHeight;
      hideSkipBtn();if(onDone)onDone();
    },80);
  });
  next();
}

function setSt(msg){document.getElementById('cinn').innerHTML='<span id="stxt">'+msg+'</span>';}

function renderChoices(choices){
  var inn=document.getElementById('cinn');inn.innerHTML='';
  choices.forEach(function(c){
    var b=document.createElement('button');b.className='cb';b.textContent=c.text;
    b.onclick=function(){onChoice(c.next);};inn.appendChild(b);
  });
}

function disableCh(){document.querySelectorAll('.cb').forEach(function(b){b.disabled=true;});}

// ── Story engine ───────────────────────────────────────────────────────
function goToNode(nodeId){
  var node=STORY[nodeId];if(!node){log('[The path ends here...]','s');return;}
  if(node.hpChange)S.hp=Math.min(S.maxHp,Math.max(0,S.hp+(node.hpChange||0)));
  if(node.xpGain)S.xp+=node.xpGain;
  if(node.goldChange)S.gold=Math.max(0,S.gold+(node.goldChange||0));
  if(node.itemGained&&S.inv.length<8)S.inv.push(node.itemGained);
  updateStats();
  if(node.event==='loot')sndPickup();
  else if((node.goldChange||0)>0)sndCoin();
  else if(node.event==='rest')sndHeal();
  else if(node.event==='encounter'&&(node.hpChange||0)<0)sndBump();
  narrativeSounds(node.lines);
  var cls=node.event==='loot'?'g':node.event==='encounter'&&(node.hpChange||0)<0?'b':'';
  var finish=function(){
    typewriterLines(node.lines,cls,function(){
      if(S.hp<=0){
        typewriterLog('💤 You collapse gently in the grass... what a journey!','s',function(){
          document.getElementById('cinn').innerHTML='<button class="cb" style="flex:none" onclick="startGame()">▸ WAKE UP & TRY AGAIN</button>';
        });return;
      }
      renderChoices(node.choices);
    });
    speak(node.lines.join(' '));
  };
  animateWalkOut(node.scene,finish);
}

function onChoice(nextId){disableCh();setSt('▸ Walking...');goToNode(nextId);}

function startGame(){
  stopLobbyMusic();
  S.hp=20;S.maxHp=20;S.xp=0;S.gold=5;S.inv=[];S.scene='intro';
  charX=160;charState='idle';
  updateStats();
  document.getElementById('log').innerHTML='';
  log('Welcome to Maplehaven, Wanderer. ✦','s');
  setTimeout(function(){animateWalkOut('village',function(){playAmbient('village');goToNode('start');});},400);
}

window.onload=function(){
  resizeCanvas();window.addEventListener('resize',resizeCanvas);
  renderScene();updateStats();
  log('Welcome, Wanderer. ✦','s');
  startLobbyMusic();
  document.getElementById('cinn').innerHTML='<button class="cb" style="flex:none" onclick="startGame()">▸ BEGIN YOUR ADVENTURE</button>';
};
</script>
</body>
