<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wanderer's Path</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#1a1208;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Press Start 2P',monospace;padding:8px;}
  #wrap{width:100%;max-width:800px;border:3px solid #7a6030;box-shadow:0 0 40px #00000088;}
  #topbar{background:#2a1e08;border-bottom:2px solid #7a6030;padding:5px 12px;display:flex;justify-content:space-between;align-items:center;}
  #title{color:#e8c040;font-size:9px;letter-spacing:1px;text-shadow:2px 2px #000;}
  .tbtn{background:none;border:1px solid #5a4020;color:#a08030;font-family:'Press Start 2P',monospace;font-size:7px;padding:3px 7px;cursor:pointer;}
  .tbtn:hover{border-color:#e8c040;color:#e8c040;}
  #scene-wrap{position:relative;width:100%;line-height:0;}
  #scene{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
  #hud{position:absolute;top:6px;left:6px;background:#1a1208ee;border:2px solid #7a6030;padding:6px 8px;font-size:7px;color:#a08030;min-width:110px;}
  .hr{display:flex;justify-content:space-between;margin-bottom:4px;gap:8px;}
  .hv{color:#e8c040;}
  .hb{background:#0a0800;border:1px solid #5a4020;height:6px;margin-bottom:5px;width:100%;}
  .hbf{height:100%;transition:width 0.3s;}
  #bhp{background:linear-gradient(90deg,#a01010,#e03020);}
  #bxp{background:linear-gradient(90deg,#103090,#2050d0);}
  #inv-bar{background:#1e1608;border-top:2px solid #5a4020;border-bottom:2px solid #5a4020;padding:5px 10px;display:flex;align-items:center;gap:4px;}
  .ilbl{font-size:6px;color:#7a6030;margin-right:3px;}
  .isl{background:#0e0c04;border:2px solid #5a4020;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .isl:hover{border-color:#e8c040;}
  #gld{margin-left:auto;font-size:8px;color:#e8c040;}
  #log{background:#120e04;border-bottom:2px solid #5a4020;padding:10px 14px;min-height:180px;max-height:260px;overflow-y:auto;}
  #log::-webkit-scrollbar{width:3px;}
  #log::-webkit-scrollbar-thumb{background:#5a4020;}
  .ll{font-size:8px;line-height:1.9;color:#c8a840;margin-bottom:1px;}
  .ll.g{color:#60b840;}.ll.b{color:#c04030;}.ll.s{color:#e8c040;}
  #cbar{background:#1a1208;border-top:2px solid #5a4020;padding:6px 8px;min-height:52px;display:flex;align-items:center;}
  #cinn{display:flex;flex-wrap:wrap;gap:5px;width:100%;}
  .cb{background:#0e0c04;border:2px solid #5a402088;color:#c8a840;font-family:'Press Start 2P',monospace;font-size:7px;padding:5px 8px;cursor:pointer;flex:1;min-width:140px;text-align:left;line-height:1.6;}
  .cb:hover{background:#2a2008;border-color:#e8c040;color:#e8c040;}
  .cb:disabled{opacity:0.3;cursor:not-allowed;}
  #stxt{color:#a08030;font-size:7px;}
</style>
</head>
<body>
<div id="wrap">
  <div id="topbar">
    <span id="title">✦ THE WANDERER'S PATH ✦</span>
    <button class="tbtn" id="vbtn" onclick="toggleVoice()">♪ VOICE: ON</button>
  </div>
  <div id="scene-wrap">
    <canvas id="scene"></canvas>
    <div id="hud">
      <div class="hr">HP <span class="hv" id="hptx">20/20</span></div>
      <div class="hb"><div class="hbf" id="bhp" style="width:100%"></div></div>
      <div class="hr">XP <span class="hv" id="xptx">0</span></div>
      <div class="hb"><div class="hbf" id="bxp" style="width:0%"></div></div>
      <div class="hr">📍<span class="hv" id="loctx">village</span></div>
    </div>
  </div>
  <div id="inv-bar">
    <span class="ilbl">INVENTORY</span>
    <div id="islots" style="display:flex;gap:3px;"></div>
    <span id="gld">⬡ <span id="gtx">5</span></span>
  </div>
  <div id="log"></div>
  <div id="cbar"><div id="cinn"><span id="stxt">▸ Loading world...</span></div></div>
</div>
<script>
// ── Constants ──────────────────────────────────────────────────────────
const PW=320, PH=180;

// ── Game state ─────────────────────────────────────────────────────────
const S={hp:20,maxHp:20,xp:0,gold:5,inv:[],hist:[],scene:'village'};

// ── Ambient scene audio ────────────────────────────────────────────────
const AMBIENT_URLS={
  village: 'https://amtrasi.github.io/wanderers-path/audio/580150__dan_audiofile__birmingham-open-air-market.wav',
  river:   'https://amtrasi.github.io/wanderers-path/audio/222752__minian89__babbling_brook_loop.wav',
  tavern:  'https://amtrasi.github.io/wanderers-path/audio/695295__brunoboselli__pirate-tavern.wav',
  forest:  'https://amtrasi.github.io/wanderers-path/audio/427400__imjeax__forest-ambient-loop.wav',
  meadow:  'https://amtrasi.github.io/wanderers-path/audio/752461__silverillusionist__windy-day-on-the-prairie-soundscape.wav',
};

let ambientAudio=null, ambientScene=null;
let footstepAudio=null;

function playAmbient(scene){
  if(ambientScene===scene) return;
  const url=AMBIENT_URLS[scene];
  if(!url) return;
  if(ambientAudio){
    const old=ambientAudio;
    fadeAudio(old, old.volume, 0, 1200, ()=>{ old.pause(); old.src=''; });
  }
  const a=new Audio(url);
  a.loop=true; a.volume=0;
  a.play().catch(()=>{});
  fadeAudio(a, 0, 0.35, 1200);
  ambientAudio=a; ambientScene=scene;
}

function fadeAudio(audio, from, to, duration, onDone){
  const steps=40, interval=duration/steps, delta=(to-from)/steps;
  let v=from, n=0;
  const iv=setInterval(()=>{
    v+=delta; n++;
    audio.volume=Math.max(0,Math.min(1,v));
    if(n>=steps){ clearInterval(iv); if(onDone) onDone(); }
  }, interval);
}

function stopAmbient(){
  if(ambientAudio){
    const old=ambientAudio;
    fadeAudio(old, old.volume, 0, 800, ()=>{ old.pause(); old.src=''; });
    ambientAudio=null; ambientScene=null;
  }
}

function startFootsteps(){
  if(footstepAudio) return;
  footstepAudio=new Audio('https://amtrasi.github.io/wanderers-path/audio/816019__qubodup__fps-footsteps-loop.wav');
  footstepAudio.loop=true; footstepAudio.volume=0.5;
  footstepAudio.play().catch(()=>{});
}

function stopFootsteps(){
  if(footstepAudio){ footstepAudio.pause(); footstepAudio.currentTime=0; footstepAudio=null; }
}

// ── Character animation ────────────────────────────────────────────────
let charX=160, charState='idle', charDir=1;
let pendingScene=null, pendingCallback=null;

function animateWalkOut(newScene, cb){
  pendingScene=newScene; pendingCallback=cb;
  charState='walkout'; charDir=1;
  playAmbient(newScene);
}

function tickChar(){
  if(charState==='walkout'){
    charX+=2;
    if(charX>PW+20){
      S.scene=pendingScene;
      charX=-20; charDir=1;
      charState='walkin';
    }
  } else if(charState==='walkin'){
    charX+=2;
    if(charX>=PW/2){
      charX=PW/2; charState='idle';
      stopFootsteps();
      if(pendingCallback){pendingCallback();pendingCallback=null;}
    }
  }
}

// ── Canvas ─────────────────────────────────────────────────────────────
const cv=document.getElementById('scene'), cx=cv.getContext('2d');
cx.imageSmoothingEnabled=false;
let af=0;

function resizeCanvas(){
  const wrap=document.getElementById('scene-wrap');
  cv.width=PW; cv.height=PH;
  cv.style.width=wrap.clientWidth+'px';
  cv.style.height=Math.round(wrap.clientWidth*(PH/PW))+'px';
}

// ── Audio ──────────────────────────────────────────────────────────────
let actx=null;
function ac(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
function tn(freq,dur,delay=0,vol=0.06,type='sine'){
  try{const ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);o.type=type;o.frequency.value=freq;
  const t=ctx.currentTime+delay;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.03);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t);o.stop(t+dur+0.05);}catch(e){}
}
function sndPickup(){[523,659,784].forEach((f,i)=>tn(f,0.18,i*0.1));}
function sndCoin(){tn(880,0.1);tn(1100,0.1,0.08);}
function sndHeal(){tn(528,0.35,0,0.05);}
function sndBump(){tn(220,0.12,0,0.05,'square');tn(180,0.14,0.09,0.04,'square');}

// Meow — soft, cat-like
function sndMeow(){
  try{const ctx=ac();
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);
  o.type='sine';
  o.frequency.setValueAtTime(600,ctx.currentTime);
  o.frequency.linearRampToValueAtTime(900,ctx.currentTime+0.08);
  o.frequency.linearRampToValueAtTime(650,ctx.currentTime+0.2);
  o.frequency.linearRampToValueAtTime(500,ctx.currentTime+0.35);
  g.gain.setValueAtTime(0,ctx.currentTime);
  g.gain.linearRampToValueAtTime(0.09,ctx.currentTime+0.05);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.38);
  o.start();o.stop(ctx.currentTime+0.4);}catch(e){}
}

// Bird chirp — two quick ascending tones
function sndBird(){
  [[0,900,1100],[0.15,1000,1300]].forEach(([delay,f1,f2])=>{
    try{const ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);o.type='sine';
    const t=ctx.currentTime+delay;
    o.frequency.setValueAtTime(f1,t);o.frequency.linearRampToValueAtTime(f2,t+0.08);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.07,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
    o.start(t);o.stop(t+0.12);}catch(e){}
  });
}

// Dog woof — low bark
function sndWoof(){
  try{const ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
  o.connect(f);f.connect(g);g.connect(ctx.destination);
  o.type='sawtooth';f.type='lowpass';f.frequency.value=400;
  o.frequency.setValueAtTime(180,ctx.currentTime);
  o.frequency.linearRampToValueAtTime(120,ctx.currentTime+0.15);
  g.gain.setValueAtTime(0,ctx.currentTime);
  g.gain.linearRampToValueAtTime(0.1,ctx.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.2);
  o.start();o.stop(ctx.currentTime+0.22);}catch(e){}
}

// Rain — soft noise burst
function sndRain(){
  try{const ctx=ac(),buf=ctx.createBuffer(1,ctx.sampleRate*0.6,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.3;
  const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  src.buffer=buf;f.type='bandpass';f.frequency.value=4000;f.Q.value=0.3;
  g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(0.08,ctx.currentTime+0.1);
  g.gain.linearRampToValueAtTime(0.08,ctx.currentTime+0.5);g.gain.linearRampToValueAtTime(0,ctx.currentTime+0.6);
  src.connect(f);f.connect(g);g.connect(ctx.destination);src.start();src.stop(ctx.currentTime+0.65);}catch(e){}
}

// Splash / water
function sndSplash(){
  try{const ctx=ac(),buf=ctx.createBuffer(1,ctx.sampleRate*0.25,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);
  const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  src.buffer=buf;f.type='bandpass';f.frequency.value=1200;f.Q.value=0.5;
  g.gain.value=0.12;
  src.connect(f);f.connect(g);g.connect(ctx.destination);src.start();src.stop(ctx.currentTime+0.28);}catch(e){}
}

// Door creak — slow gliding tone
function sndDoor(){
  try{const ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();
  o.connect(g);g.connect(ctx.destination);o.type='sawtooth';
  o.frequency.setValueAtTime(300,ctx.currentTime);
  o.frequency.linearRampToValueAtTime(180,ctx.currentTime+0.4);
  g.gain.setValueAtTime(0.06,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.45);
  o.start();o.stop(ctx.currentTime+0.5);}catch(e){}
}

// Coins / market
function sndMarket(){sndCoin();setTimeout(sndCoin,120);setTimeout(sndCoin,260);}

// Wind whoosh
function sndWind(){
  try{const ctx=ac(),buf=ctx.createBuffer(1,ctx.sampleRate*0.5,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(Math.sin(i/d.length*Math.PI),0.5);
  const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  src.buffer=buf;f.type='bandpass';f.frequency.value=600;f.Q.value=0.4;
  g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(0.07,ctx.currentTime+0.15);
  g.gain.linearRampToValueAtTime(0,ctx.currentTime+0.5);
  src.connect(f);f.connect(g);g.connect(ctx.destination);src.start();src.stop(ctx.currentTime+0.55);}catch(e){}
}

// Fire crackle
function sndFire(){
  try{const ctx=ac(),buf=ctx.createBuffer(1,ctx.sampleRate*0.18,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,0.8);
  const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  src.buffer=buf;f.type='bandpass';f.frequency.value=300;f.Q.value=1;g.gain.value=0.1;
  src.connect(f);f.connect(g);g.connect(ctx.destination);src.start();src.stop(ctx.currentTime+0.2);}catch(e){}
}

// Detect keywords in narrative and play matching sounds
function narrativeSounds(lines){
  const text=lines.join(' ').toLowerCase();
  if(/\bcat\b|kitten|meow|purr/.test(text)) setTimeout(sndMeow,300);
  if(/\bbird|chirp|sparrow|robin|feather|wing/.test(text)) setTimeout(sndBird,300);
  if(/\bdog\b|puppy|bark|woof|hound/.test(text)) setTimeout(sndWoof,300);
  if(/\brain|drizzle|downpour|shower|drops/.test(text)) setTimeout(sndRain,300);
  if(/\briver|splash|stream|puddle|pond|water/.test(text)) setTimeout(sndSplash,300);
  if(/\bdoor|creak|gate|enter|inn|tavern/.test(text)) setTimeout(sndDoor,400);
  if(/\bmarket|merchant|coin|shop|sell|buy|trade/.test(text)) setTimeout(sndMarket,300);
  if(/\bwind|breeze|gust|leaves rustle/.test(text)) setTimeout(sndWind,300);
  if(/\bfire|flame|hearth|torch|candle/.test(text)) setTimeout(sndFire,400);
}

// ── TTS ────────────────────────────────────────────────────────────────
let voiceOn=true, curAudio=null;
const XIK='sk_ba08c6246de3fc999a143a77c6c31601acb3dac580a14f26';
const XIV='N2lVS1w4EtoT3dr4eOWO';
async function speak(text){
  if(!voiceOn)return;
  if(curAudio){curAudio.pause();curAudio=null;}
  try{
    const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${XIV}`,{
      method:'POST',
      headers:{'xi-api-key':XIK,'Content-Type':'application/json','Accept':'audio/mpeg'},
      body:JSON.stringify({text,model_id:'eleven_turbo_v2',voice_settings:{stability:0.4,similarity_boost:0.75,style:0.55,use_speaker_boost:true}})
    });
    if(!r.ok)return;
    curAudio=new Audio(URL.createObjectURL(await r.blob()));
    curAudio.play().catch(()=>{});
  }catch(e){}
}
function toggleVoice(){
  voiceOn=!voiceOn;
  if(!voiceOn&&curAudio){curAudio.pause();curAudio=null;}
  document.getElementById('vbtn').textContent=`♪ VOICE: ${voiceOn?'ON':'OFF'}`;
}

// ── Pixel drawing helpers ──────────────────────────────────────────────
function rect(x,y,w,h,c){cx.fillStyle=c;cx.fillRect(x,y,w,h);}
function dot(x,y,c){cx.fillStyle=c;cx.fillRect(x,y,1,1);}
function hline(x,y,w,c){cx.fillStyle=c;cx.fillRect(x,y,w,1);}
function vline(x,y,h,c){cx.fillStyle=c;cx.fillRect(x,y,1,h);}

function stoneTile(x,y,w,h,light='#9a9080',dark='#6a6058',shadow='#4a4038'){
  rect(x,y,w,h,dark);
  const bh=6,bw=10;
  for(let row=0;row<Math.ceil(h/bh);row++){
    const off=(row%2)*5;
    for(let col=0;col<Math.ceil(w/bw)+1;col++){
      const bx=x+col*bw-off, by=y+row*bh;
      if(bx+bw<x||bx>x+w) continue;
      const cx2=Math.max(bx,x), cw=Math.min(bx+bw,x+w)-cx2;
      const ch=Math.min(bh-1,y+h-by); if(ch<=0) continue;
      rect(cx2,by,cw,ch,light);
      hline(cx2,by+ch-1,cw,shadow);
      vline(cx2+cw-1,by,ch,shadow);
    }
  }
}

function cobblePath(x,y,w,h){
  rect(x,y,w,h,'#8a7850');
  const pat=[[0,0,12,7],[13,1,10,6],[24,0,14,7],[39,1,11,6],[51,0,13,7],[65,1,10,6],[76,0,14,7],[91,1,11,6],[103,0,13,7],[117,1,10,6],[128,0,14,7],[143,1,11,6],[155,0,13,7],[169,1,10,6],[180,0,14,7],[195,1,11,6],[207,0,13,7],[221,1,10,6],[232,0,14,7],[247,1,11,6],[259,0,13,7],[273,1,10,6],[285,0,14,7],[300,1,11,6],[312,0,8,7],[0,8,14,7],[15,9,10,6],[26,8,13,7],[40,9,11,6],[52,8,12,7],[65,9,10,6],[76,8,14,7],[91,9,11,6],[103,8,13,7],[117,9,10,6],[128,8,14,7],[143,9,11,6],[155,8,13,7],[169,9,10,6],[180,8,14,7],[195,9,11,6],[207,8,13,7],[221,9,10,6],[232,8,14,7],[247,9,11,6],[259,8,13,7],[273,9,10,6],[285,8,14,7],[300,9,11,6]];
  pat.forEach(([sx,sy,sw,sh])=>{
    const ax=x+(sx%(w||1)), ay=y+sy;
    if(ax>x+w||ay>y+h) return;
    const fw=Math.min(sw,x+w-ax), fh=Math.min(sh,y+h-ay);
    rect(ax,ay,fw,fh,'#b0986a');
    hline(ax,ay,fw,'#c8ae82');
    vline(ax,ay,fh,'#c8ae82');
    hline(ax,ay+fh-1,fw,'#786040');
    vline(ax+fw-1,ay,fh,'#786040');
  });
}

function pixelTree(x,y,sc=1){
  const s=Math.max(1,Math.round(sc));
  const tw=6*s, tx=x-tw/2;
  rect(tx,y,tw,24*s,'#5a3010');
  rect(tx+1,y,tw-2,24*s,'#7a4818');
  rect(tx-3,y+20*s,4,4,'#5a3010');
  rect(tx+tw-1,y+20*s,4,4,'#5a3010');
  [[x,y-10*s,18*s,14*s,'#1a3808'],[x-4*s,y-6*s,14*s,12*s,'#224a0a'],[x+2*s,y-8*s,16*s,13*s,'#1e4208'],[x-2*s,y-14*s,16*s,12*s,'#2a5a0c'],[x,y-18*s,12*s,10*s,'#347010'],[x-1*s,y-20*s,10*s,8*s,'#408018'],[x+1*s,y-22*s,8*s,7*s,'#4a9020'],[x-3*s,y-16*s,5*s,5*s,'#5aa828'],[x+2*s,y-19*s,4*s,4*s,'#62b02e']].forEach(([lx,ly,lw,lh,lc])=>{
    const hw=Math.floor(lw/2);
    for(let row=0;row<lh;row++){const bulge=Math.sin((row/lh)*Math.PI);const rw=Math.max(1,Math.round(lw*bulge));const rx=lx-hw+Math.round((lw-rw)/2);rect(rx,ly+row,rw,1,lc);}
  });
}

function pixelBush(x,y,c1='#2a5010',c2='#3a6818',c3='#4a8020'){
  rect(x-6,y-4,12,6,c1);rect(x-4,y-6,8,4,c2);rect(x-2,y-7,5,3,c3);
  rect(x-7,y-3,4,4,c2);rect(x+3,y-4,4,4,c2);
}

function stoneArch(x,y,w,h){
  stoneTile(x,y,8,h,'#9a9080','#7a7068','#5a5048');
  stoneTile(x+w-8,y,8,h,'#9a9080','#7a7068','#5a5048');
  const cy2=y+h;
  for(let i=0;i<w-16;i++){const t=(i/(w-16))*Math.PI;const ay=cy2-Math.round(Math.sin(t)*(h*0.7));rect(x+8+i,ay,1,cy2-ay,'#7a7068');}
}

function pixelHouse(x,y,w=50,h=40){
  stoneTile(x,y+Math.round(h*0.3),w,Math.round(h*0.7));
  const rh=Math.round(h*0.4);
  for(let row=0;row<rh;row++){const sh=row/rh;rect(x+row,y+row,w-row*2,1,`rgb(${Math.round(160-sh*60)},${Math.round(60-sh*20)},10)`);}
  rect(x+8,y+Math.round(h*0.45),10,8,'#1a2030');
  hline(x+8,y+Math.round(h*0.45),10,'#a09070');
  rect(x+Math.round(w*0.4),y+Math.round(h*0.65),Math.round(w*0.2),Math.round(h*0.35),'#3a1c08');
}

function pixelWater(x,y,w,h){
  const t=Date.now()/800;
  for(let row=0;row<h;row++){const d=row/h;rect(x,y+row,w,1,`rgb(${Math.round(20+d*10)},${Math.round(60+d*20)},${Math.round(120+d*30)})`);}
  for(let i=0;i<5;i++){const rx=(i*65+Math.floor(t*20))%w;rect(x+rx,y+Math.round(h*0.3),20,1,'rgba(180,220,255,0.25)');rect(x+rx+8,y+Math.round(h*0.6),12,1,'rgba(180,220,255,0.2)');}
}

function pixelNPC(x,y,emoji){
  cx.save();cx.globalAlpha=0.3;cx.fillStyle='#e8d060';cx.beginPath();cx.arc(x,y,10,0,Math.PI*2);cx.fill();cx.restore();
  cx.font='14px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(emoji,x,y);
}

function pixelPlayer(px,py,frame,dir=1){
  cx.save();
  if(dir===-1){cx.translate(Math.round(px)*2,0);cx.scale(-1,1);}
  const x=Math.round(px-8), y=Math.round(py-20);
  const legA=frame===1?3:frame===3?-3:0;
  const legB=frame===1?-3:frame===3?3:0;
  const bob=(frame===1||frame===3)?-1:0;
  const skin='#8B5E3C'; // warm brown skin tone
  const hair='#1a0e00'; // dark black-brown hair
  rect(x+2,y+22,12,2,'rgba(0,0,0,0.3)');
  // back leg
  rect(x+3+legB,y+12+bob,4,7,'#5a3472');
  rect(x+2+legB,y+18+bob,5,4,'#2a1800');
  // skirt flare over legs
  rect(x+1,y+11+bob,14,5,'#c03060');
  // body — tunic/top
  rect(x+2,y+5+bob,12,8,'#c03060');
  // sash/belt detail
  hline(x+2,y+12+bob,12,'#e8a020');
  // cape/shawl
  rect(x+1,y+6+bob,2,8+(frame===1?1:frame===3?-1:0),'#801840');
  rect(x+12,y+6+bob,2,8-(frame===1?1:frame===3?-1:0),'#801840');
  // arms
  rect(x+1,y+7+legB+bob,3,6,skin);
  rect(x+12,y+7+legA+bob,3,6,skin);
  rect(x+1,y+12+legB+bob,2,2,skin);
  rect(x+13,y+12+legA+bob,2,2,skin);
  // front leg
  rect(x+9+legA,y+12+bob,4,7,'#5a3472');
  rect(x+9+legA,y+18+bob,5,4,'#2a1800');
  // neck
  rect(x+7,y+4+bob,3,3,skin);
  // head
  rect(x+5,y-2,8,7,skin);
  // hair — long, dark, natural
  rect(x+4,y-5,9,4,hair);      // top
  rect(x+3,y-4,2,10,hair);     // left side long
  rect(x+12,y-4,2,9,hair);     // right side long
  rect(x+4,y-5,3,2,hair);
  rect(x+4,y+4,2,4,hair);      // hair falling past shoulder
  rect(x+11,y+4,2,4,hair);
  // eyes — dark, expressive
  dot(x+7,y+1,'#1a0800');dot(x+10,y+1,'#1a0800');
  // eye shine
  dot(x+8,y+1,'rgba(255,255,255,0.6)');dot(x+11,y+1,'rgba(255,255,255,0.6)');
  // small smile
  cx.strokeStyle='#6a3010';cx.lineWidth=1;cx.beginPath();cx.arc(px-1,py-19,3,0.3,Math.PI-0.3);cx.stroke();
  // small earring
  dot(x+4,y+2,'#e8c020');
  // sword/staff at hip
  rect(x+14,y+10+bob,2,8,'#909090');rect(x+14,y+10+bob,4,2,'#c8a030');
  cx.restore();
}

function renderScene(){
  cx.imageSmoothingEnabled=false;
  (SCENES[S.scene]||SCENES.village)(PW,PH);
  tickChar();
  const walking=charState!=='idle';
  const walkFrame=walking?Math.floor(af/5)%4:0;
  pixelPlayer(charX,PH*0.72,walkFrame,charDir);
  af++;
  requestAnimationFrame(renderScene);
}

// ── UI ─────────────────────────────────────────────────────────────────
const EMOJIS={'honey cake':'🍯','warm scarf':'🧣','lucky acorn':'🌰','mushroom':'🍄','gold coin':'🪙','lantern':'🏮','flower bouquet':'💐','healing herb':'🌿','bread loaf':'🍞','map fragment':'🗺️','fish':'🐟','key':'🗝️'};

function updateStats(){
  document.getElementById('hptx').textContent=`${S.hp}/${S.maxHp}`;
  document.getElementById('bhp').style.width=Math.max(0,(S.hp/S.maxHp)*100)+'%';
  document.getElementById('xptx').textContent=S.xp;
  document.getElementById('bxp').style.width=Math.min(100,S.xp%100)+'%';
  document.getElementById('gtx').textContent=S.gold;
  document.getElementById('loctx').textContent=S.scene;
  const sl=document.getElementById('islots');sl.innerHTML='';
  for(let i=0;i<8;i++){const d=document.createElement('div');d.className='isl';d.textContent=S.inv[i]?(EMOJIS[S.inv[i].toLowerCase()]||'📦'):'·';if(S.inv[i])d.title=S.inv[i];sl.appendChild(d);}
}

function log(text,cls=''){
  const b=document.getElementById('log'),d=document.createElement('div');
  d.className='ll'+(cls?' '+cls:'');d.textContent=text;
  b.appendChild(d);b.scrollTop=b.scrollHeight;
  if(b.children.length>80)b.removeChild(b.children[0]);
}

function typewriterLog(text, cls='', onDone){
  const b=document.getElementById('log');
  const d=document.createElement('div');
  d.className='ll'+(cls?' '+cls:'');
  d.textContent='';
  b.appendChild(d);
  let i=0;
  const iv=setInterval(()=>{
    d.textContent+=text[i++];
    b.scrollTop=b.scrollHeight;
    if(i>=text.length){clearInterval(iv);if(onDone)onDone();}
  },28);
}

function typewriterLines(lines, cls='', onDone){
  let i=0;
  function next(){
    if(i>=lines.length){if(onDone)onDone();return;}
    typewriterLog(lines[i++],cls,()=>setTimeout(next,120));
  }
  next();
}

function setSt(msg){document.getElementById('cinn').innerHTML=`<span id="stxt">${msg}</span>`;}

function renderChoices(ch){
  const inn=document.getElementById('cinn');inn.innerHTML='';
  if(!ch||!ch.length){setSt('[no choices]');return;}
  ch.forEach(c=>{const b=document.createElement('button');b.className='cb';b.textContent=c;b.onclick=()=>onChoice(c,ch);inn.appendChild(b);});
}

function disableCh(){document.querySelectorAll('.cb').forEach(b=>b.disabled=true);}

// ── Claude ─────────────────────────────────────────────────────────────
const SYS=`You are the warm, whimsical narrator of a cozy pixel-art RPG — think classic JRPG meets hobbit-core. Rolling hills, stone villages, mossy forests, riverside inns, friendly creatures. Tone: wholesome, charming, occasionally witty.

Respond ONLY with valid JSON, no markdown.
{"location":"village|meadow|forest|tavern|river","narrative":["line1","line2"],"event":"none|encounter|loot|rest|magic|gameover","hpChange":0,"xpGain":0,"goldChange":0,"itemGained":"","choices":["A) ...","B) ...","C) ..."]}

location = exactly one of the 5 options. 2-3 warm lines. encounter: hpChange -2 to -4. loot: gold or item. rest: hpChange +4 to +8. gameover only if hp=0, gentle/funny. Always 3 choices. JSON ONLY.`;

async function callClaude(action){
  S.hist.push({role:'user',content:`State:${JSON.stringify({hp:S.hp,maxHp:S.maxHp,xp:S.xp,gold:S.gold,inv:S.inv,scene:S.scene})}\nAction:${action}`});
  const r=await fetch('/api/claude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,system:SYS,messages:S.hist})});
  if(!r.ok)throw new Error('API '+r.status);
  const data=await r.json();
  const raw=data.content.map(b=>b.text||'').join('');
  const parsed=JSON.parse(raw.replace(/```json|```/g,'').trim());
  S.hist.push({role:'assistant',content:raw});
  if(S.hist.length>18)S.hist=S.hist.slice(-14);
  return parsed;
}

async function onChoice(text,all){
  disableCh();log('▸ '+text,'s');setSt('▸ Walking...');
  try{
    const res=await callClaude(text);
    if(res.hpChange)S.hp=Math.min(S.maxHp,Math.max(0,S.hp+res.hpChange));
    if(res.xpGain)S.xp+=res.xpGain;
    if(res.goldChange)S.gold=Math.max(0,S.gold+res.goldChange);
    if(res.itemGained&&S.inv.length<8)S.inv.push(res.itemGained);
    updateStats();
    if(res.event==='loot'||res.event==='magic')sndPickup();
    else if(res.goldChange>0)sndCoin();
    else if(res.event==='rest')sndHeal();
    else if(res.event==='encounter'&&res.hpChange<0)sndBump();
    speak(res.narrative.join(' '));
    narrativeSounds(res.narrative);
    const narCls=res.event==='loot'?'g':res.event==='encounter'&&res.hpChange<0?'b':'';
    typewriterLines(res.narrative, narCls, ()=>{
      const newScene=res.location||S.scene;
      const finish=()=>{
        if(res.event==='gameover'){typewriterLog('💤 You dozed off peacefully!','s',()=>{document.getElementById('cinn').innerHTML='<button class="cb" style="flex:none" onclick="startGame()">▸ WAKE UP & TRY AGAIN</button>';});return;}
        renderChoices(res.choices);
      };
      setTimeout(()=>animateWalkOut(newScene,finish),200);
    });
  }catch(e){
    charState='idle';charX=160;
    console.error(e);log('[Connection error — try again]','s');renderChoices(all);
  }
}

async function startGame(){
  S.hp=20;S.maxHp=20;S.xp=0;S.gold=5;S.inv=[];S.hist=[];S.scene='village';
  charX=160;charState='idle';
  updateStats();document.getElementById('log').innerHTML='';setSt('▸ Loading world...');
  try{
    const res=await callClaude('BEGIN GAME. Welcome the wanderer to a charming pixel-art world. Warm hobbit-core tone. Start in the village.');
    if(res.location)S.scene=res.location;updateStats();
    playAmbient(S.scene);
    speak(res.narrative.join(' '));
    typewriterLines(res.narrative, '', ()=>renderChoices(res.choices));
  }catch(e){
    console.error(e);setSt('[Could not reach the realm — retry]');
    document.getElementById('cinn').innerHTML='<button class="cb" style="flex:none" onclick="startGame()">▸ RETRY</button>';
  }
}

window.onload=()=>{
  resizeCanvas();window.addEventListener('resize',resizeCanvas);
  renderScene();updateStats();
  log('Welcome, Wanderer. ✦','s');
  document.getElementById('cinn').innerHTML='<button class="cb" style="flex:none" onclick="startGame()">▸ BEGIN YOUR ADVENTURE</button>';
};
