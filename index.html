<script>
const S={hp:20,maxHp:20,xp:0,gold:5,inv:[],history:[],scene:'meadow'};

// ── Audio: event sounds only ───────────────────────────────────────────
let actx=null;
function ac(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
function cheerTone(freq,dur,delay=0,vol=0.06){
  try{
    const ctx=ac(),o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='sine';o.frequency.value=freq;
    const t=ctx.currentTime+delay;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.03);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.start(t);o.stop(t+dur+0.05);
  }catch(e){}
}
function sndPickup(){[523,659,784].forEach((f,i)=>cheerTone(f,0.18,i*0.1));}
function sndCoin(){cheerTone(880,0.12);cheerTone(1100,0.12,0.08);}
function sndHeal(){cheerTone(528,0.4,0,0.05);}
function sndBump(){cheerTone(330,0.1,0,0.04);cheerTone(280,0.12,0.08,0.04);}
function sndGrass(){
  try{
    const ctx=ac(),buf=ctx.createBuffer(1,ctx.sampleRate*0.08,ctx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
    const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    src.buffer=buf;f.type='bandpass';f.frequency.value=900;f.Q.value=0.6;
    g.gain.setValueAtTime(0.18,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.08);
    src.connect(f);f.connect(g);g.connect(ctx.destination);src.start();src.stop(ctx.currentTime+0.09);
  }catch(e){}
}

// ── Narrator voice (ElevenLabs) ────────────────────────────────────────
let voiceOn=true, currentAudio=null;
const XI_KEY='sk_ba08c6246de3fc999a143a77c6c31601acb3dac580a14f26';
const XI_VOICE='N2lVS1w4EtoT3dr4eOWO';

async function speak(text){
  if(!voiceOn) return;
  if(currentAudio){currentAudio.pause();currentAudio=null;}
  try{
    const resp=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${XI_VOICE}`,{
      method:'POST',
      headers:{'xi-api-key':XI_KEY,'Content-Type':'application/json','Accept':'audio/mpeg'},
      body:JSON.stringify({text,model_id:'eleven_turbo_v2',voice_settings:{stability:0.4,similarity_boost:0.75,style:0.55,use_speaker_boost:true}})
    });
    if(!resp.ok){console.error('TTS failed',resp.status);return;}
    const blob=await resp.blob();
    currentAudio=new Audio(URL.createObjectURL(blob));
    currentAudio.play().catch(e=>console.error('Audio play error',e));
  }catch(e){console.error('TTS error',e);}
}

function toggleVoice(){
  voiceOn=!voiceOn;
  if(!voiceOn&&currentAudio){currentAudio.pause();currentAudio=null;}
  document.getElementById('voice-btn').textContent=`🔊 NARRATOR: ${voiceOn?'ON':'OFF'}`;
}

// ── Canvas ─────────────────────────────────────────────────────────────
const canvas=document.getElementById('scene'),cx=canvas.getContext('2d');
let af=0,lastStep=0,isWalking=false;

const SCENES={
  meadow:{bg:'#4a8a30',ents:[
    {t:'path',x:0,y:160,w:520,h:22},
    {t:'tree',x:30,y:20},{t:'tree',x:260,y:40},{t:'tree',x:390,y:15},
    {t:'flower',x:110,y:115},{t:'flower',x:190,y:75},{t:'flower',x:310,y:130},{t:'flower',x:60,y:80},
    {t:'npc',x:320,y:128,e:'🧙',l:'Sage'},{t:'npc',x:80,y:128,e:'🐇',l:'Bunny'},
  ]},
  village:{bg:'#5a8840',ents:[
    {t:'path',x:0,y:158,w:520,h:24},
    {t:'house',x:20,y:15},{t:'house',x:230,y:20},
    {t:'well',x:155,y:95},
    {t:'tree',x:370,y:20},{t:'tree',x:430,y:55},
    {t:'npc',x:195,y:126,e:'👨‍🌾',l:'Farmer'},{t:'npc',x:105,y:118,e:'🐑',l:'Sheep'},
  ]},
  forest:{bg:'#2e5a1e',ents:[
    {t:'path',x:0,y:155,w:520,h:24},
    {t:'tree',x:15,y:5},{t:'tree',x:85,y:35},{t:'tree',x:165,y:5},{t:'tree',x:255,y:45},{t:'tree',x:335,y:15},{t:'tree',x:405,y:40},
    {t:'tree',x:45,y:85},{t:'tree',x:300,y:95},
    {t:'mushroom',x:125,y:125},{t:'mushroom',x:215,y:110},
    {t:'npc',x:190,y:122,e:'🦊',l:'Fox'},
  ]},
  tavern:{bg:'#6a3a10',ents:[
    {t:'tavern-bg'},{t:'npc',x:115,y:108,e:'🍺',l:'Barkeep'},{t:'npc',x:265,y:118,e:'🎶',l:'Bard'},
  ]},
  river:{bg:'#4a8030',ents:[
    {t:'water',x:0,y:75,w:520,h:78},
    {t:'tree',x:15,y:5},{t:'tree',x:360,y:15},{t:'tree',x:430,y:45},
    {t:'flower',x:75,y:50},{t:'flower',x:295,y:48},{t:'flower',x:155,y:45},
    {t:'path',x:0,y:178,w:520,h:22},
    {t:'npc',x:205,y:50,e:'🦆',l:'Duck'},
  ]},
};

function drawTree(x,y){cx.fillStyle='#5a3000';cx.fillRect(x+10,y+40,8,25);cx.fillStyle='#2a6010';cx.beginPath();cx.arc(x+14,y+25,22,0,Math.PI*2);cx.fill();cx.fillStyle='#3a8020';cx.beginPath();cx.arc(x+14,y+18,16,0,Math.PI*2);cx.fill();cx.fillStyle='#4a9030';cx.beginPath();cx.arc(x+10,y+20,10,0,Math.PI*2);cx.fill();}
function drawHouse(x,y){cx.fillStyle='#e8d090';cx.fillRect(x,y+30,70,50);cx.fillStyle='#b03020';cx.beginPath();cx.moveTo(x-5,y+32);cx.lineTo(x+35,y);cx.lineTo(x+75,y+32);cx.fill();cx.fillStyle='#7a4010';cx.fillRect(x+24,y+55,20,25);cx.fillStyle='#a0c8e8';cx.fillRect(x+5,y+40,18,16);cx.fillRect(x+47,y+40,18,16);cx.fillStyle='#7a5020';cx.fillRect(x+12,y+40,2,16);cx.fillRect(x+5,y+48,18,2);cx.fillRect(x+54,y+40,2,16);cx.fillRect(x+47,y+48,18,2);cx.fillStyle='#804020';cx.fillRect(x+48,y+2,12,24);cx.fillStyle='rgba(200,200,200,0.35)';[0,1,2].forEach(i=>{cx.beginPath();cx.arc(x+54,y-10-i*12,4+i*2,0,Math.PI*2);cx.fill();});}
function drawWell(x,y){cx.fillStyle='#808080';cx.fillRect(x,y+20,36,24);cx.fillStyle='#1a60a0';cx.fillRect(x+4,y+28,28,12);cx.fillStyle='#5a3000';cx.fillRect(x-3,y,6,22);cx.fillRect(x+33,y,6,22);cx.fillStyle='#7a4000';cx.fillRect(x-4,y-2,44,6);}
function drawFlower(x,y){const cols=['#ff9090','#ff90ff','#ffff50','#90ffee'];cx.fillStyle='#40a020';cx.fillRect(x+3,y+8,3,14);cx.fillStyle=cols[Math.floor((x*3)%cols.length)];cx.beginPath();cx.arc(x+4,y+6,6,0,Math.PI*2);cx.fill();cx.fillStyle='#ffff90';cx.beginPath();cx.arc(x+4,y+6,3,0,Math.PI*2);cx.fill();}
function drawMushroom(x,y){cx.fillStyle='#e8e0c0';cx.fillRect(x+6,y+14,8,14);cx.fillStyle='#c83020';cx.beginPath();cx.arc(x+10,y+14,14,Math.PI,0);cx.fill();cx.fillStyle='#fff';[[3,8],[14,5],[8,2]].forEach(([dx,dy])=>{cx.beginPath();cx.arc(x+dx,y+dy,3,0,Math.PI*2);cx.fill();});}
function drawWater(x,y,w,h){const t=Date.now()/1000;cx.fillStyle='#2a78c0';cx.fillRect(x,y,w,h);cx.fillStyle='#3898e0';for(let i=0;i<5;i++){const wx=(i*90+(t*18)%90)%(w-30);cx.fillRect(wx,y+h*.3,28,4);cx.fillRect(wx+14,y+h*.65,18,3);}}
function drawPath(x,y,w,h){cx.fillStyle='#c8a060';cx.fillRect(x,y,w,h);cx.fillStyle='#b89050';for(let i=0;i<8;i++)cx.fillRect(x+i*68,y+h/2-1,38,2);}
function drawTavernBg(){cx.fillStyle='#5a3008';cx.fillRect(0,0,520,100);for(let i=0;i<8;i++)for(let j=2;j<7;j++){cx.fillStyle=(i+j)%2===0?'#7a4818':'#6a3808';cx.fillRect(i*66,j*50,65,49);}cx.fillStyle='#8a5020';cx.fillRect(20,18,160,10);['#c84040','#40c880','#c8a040','#4080c8'].forEach((col,i)=>{cx.fillStyle=col;cx.fillRect(28+i*40,4,14,16);});cx.fillStyle='#8a5020';cx.fillRect(0,98,200,18);cx.fillStyle='#7a4010';cx.fillRect(0,114,200,56);cx.fillStyle='#808080';cx.fillRect(360,28,90,70);cx.fillStyle='#302010';cx.fillRect(370,48,70,50);cx.fillStyle='#ff8020';cx.fillRect(378,56,54,40);cx.fillStyle='#ffcc00';cx.fillRect(388,64,34,28);cx.fillStyle='#8a5020';cx.fillRect(220,138,100,10);cx.fillStyle='#7a4010';cx.fillRect(230,148,8,40);cx.fillRect(302,148,8,40);cx.fillStyle='#c8a040';cx.fillRect(240,126,16,14);cx.fillRect(280,126,16,14);}
function drawNPC(x,y,e,l){cx.font='26px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(e,x,y);cx.font='9px Share Tech Mono';cx.fillStyle='#ffd060';cx.textBaseline='top';cx.fillText(l,x,y+14);}
function drawPlayer(px,py){cx.fillStyle='rgba(0,0,0,0.2)';cx.beginPath();cx.ellipse(px,py+18,10,4,0,0,Math.PI*2);cx.fill();cx.fillStyle='#4a3090';cx.fillRect(px-6,py+6,5,12);cx.fillRect(px+1,py+6,5,12);cx.fillStyle='#3a2000';cx.fillRect(px-7,py+16,6,5);cx.fillRect(px+1,py+16,6,5);cx.fillStyle='#60a840';cx.fillRect(px-8,py-8,16,16);cx.fillStyle='#60a840';cx.fillRect(px-13,py-6,6,10);cx.fillRect(px+7,py-6,6,10);cx.fillStyle='#f4c07a';cx.fillRect(px-6,py-22,12,14);cx.fillStyle='#3a2000';cx.fillRect(px-7,py-28,14,8);cx.fillStyle='#5a3000';cx.fillRect(px-9,py-22,18,3);cx.fillStyle='#000';cx.fillRect(px-4,py-17,2,2);cx.fillRect(px+2,py-17,2,2);cx.fillStyle='#c07050';cx.fillRect(px-3,py-12,6,2);}

function resizeCanvas(){const wrap=document.getElementById('scene-wrap');canvas.width=wrap.clientWidth||500;canvas.height=wrap.clientHeight||400;}

function renderScene(){
  const def=SCENES[S.scene]||SCENES.meadow;
  cx.fillStyle=def.bg;cx.fillRect(0,0,canvas.width,canvas.height);
  def.ents.forEach(e=>{
    if(e.t==='tree')drawTree(e.x,e.y);
    else if(e.t==='house')drawHouse(e.x,e.y);
    else if(e.t==='well')drawWell(e.x,e.y);
    else if(e.t==='flower')drawFlower(e.x,e.y);
    else if(e.t==='mushroom')drawMushroom(e.x,e.y);
    else if(e.t==='water')drawWater(e.x,e.y,e.w,e.h);
    else if(e.t==='path')drawPath(e.x,e.y,e.w,e.h);
    else if(e.t==='tavern-bg')drawTavernBg();
    else if(e.t==='npc')drawNPC(e.x,e.y,e.e,e.l);
  });
  const bob=Math.sin(af*0.07)*2;
  drawPlayer(canvas.width/2,canvas.height-75+bob);
  if(isWalking&&Math.sin(af*0.07)>0.95&&af-lastStep>10){sndGrass();lastStep=af;}
  af++;
  requestAnimationFrame(renderScene);
}

// ── UI ─────────────────────────────────────────────────────────────────
const EMOJIS={'honey cake':'🍯','warm scarf':'🧣','lucky acorn':'🌰','mushroom':'🍄','gold coin':'🪙','lantern':'🏮','flower bouquet':'💐','healing herb':'🌿','bread loaf':'🍞','map fragment':'🗺️','fish':'🐟','key':'🗝️'};

function updateStats(){
  document.getElementById('hp-txt').textContent=`${S.hp}/${S.maxHp}`;
  document.getElementById('hp-bar').style.width=Math.max(0,(S.hp/S.maxHp)*100)+'%';
  document.getElementById('xp-txt').textContent=S.xp;
  document.getElementById('xp-bar').style.width=Math.min(100,S.xp%100)+'%';
  document.getElementById('gold-txt').textContent=S.gold;
  document.getElementById('loc-txt').textContent=S.scene;
  const grid=document.getElementById('inv-grid');grid.innerHTML='';
  for(let i=0;i<8;i++){const d=document.createElement('div');d.className='inv-slot';d.textContent=S.inv[i]?(EMOJIS[S.inv[i].toLowerCase()]||'📦'):'·';if(S.inv[i])d.title=S.inv[i];grid.appendChild(d);}
}

function log(text,cls='info'){
  const box=document.getElementById('log-box'),d=document.createElement('div');
  d.className='log-line '+cls;d.textContent=text;box.appendChild(d);box.scrollTop=box.scrollHeight;
  if(box.children.length>80)box.removeChild(box.children[0]);
}

function setStatus(msg){document.getElementById('choices-inner').innerHTML=`<span id="status-txt">${msg}</span>`;}

function renderChoices(choices){
  const inner=document.getElementById('choices-inner');inner.innerHTML='';
  if(!choices||!choices.length){setStatus('[ No choices — try refreshing ]');return;}
  choices.forEach(ch=>{const btn=document.createElement('button');btn.className='choice-btn';btn.textContent=ch;btn.onclick=()=>onChoice(ch,choices);inner.appendChild(btn);});
}

function disableChoices(){document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);}

// ── Claude API ─────────────────────────────────────────────────────────
const SYS=`You are the warm, whimsical narrator of a cozy top-down RPG. Think RuneScape meets hobbit-core: rolling green hills, friendly villagers, curious woodland creatures, delicious food, gentle magic, small charming adventures. Tone: wholesome, witty, heartwarming.

Respond ONLY with valid JSON — no markdown fences, no extra text.

{
  "location": "meadow|village|forest|tavern|river",
  "narrative": ["line1","line2"],
  "event": "none|encounter|loot|rest|magic|gameover",
  "hpChange": 0,
  "xpGain": 0,
  "goldChange": 0,
  "itemGained": "",
  "choices": ["A) ...", "B) ...", "C) ..."]
}

Rules:
- location must be exactly one of: meadow, village, forest, tavern, river
- 2-3 short warm lines
- encounter: hpChange -2 to -4, xpGain 5-15
- loot: goldChange+ or itemGained (honey cake/warm scarf/lucky acorn/mushroom/lantern/flower bouquet/healing herb/bread loaf/map fragment/fish/key)
- rest: hpChange +4 to +8
- magic: fun positive effect
- gameover ONLY if hp hits 0 — gentle, funny (wanderer dozed off)
- Always include exactly 3 choices
- ONLY output the JSON object`;

async function callClaude(action){
  const msg=`State:${JSON.stringify({hp:S.hp,maxHp:S.maxHp,xp:S.xp,gold:S.gold,inv:S.inv,scene:S.scene})}\nAction:${action}`;
  S.history.push({role:'user',content:msg});
  const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,system:SYS,messages:S.history})});
  if(!resp.ok)throw new Error('API error '+resp.status);
  const data=await resp.json();
  const raw=data.content.map(b=>b.text||'').join('');
  const parsed=JSON.parse(raw.replace(/```json|```/g,'').trim());
  S.history.push({role:'assistant',content:raw});
  if(S.history.length>18)S.history=S.history.slice(-14);
  return parsed;
}

// ── Game logic ─────────────────────────────────────────────────────────
async function onChoice(text,allChoices){
  disableChoices();log('▸ '+text,'sys');setStatus('▸ Walking...');isWalking=true;
  try{
    const res=await callClaude(text);
    isWalking=false;
    if(res.hpChange)S.hp=Math.min(S.maxHp,Math.max(0,S.hp+res.hpChange));
    if(res.xpGain)S.xp+=res.xpGain;
    if(res.goldChange)S.gold=Math.max(0,S.gold+res.goldChange);
    if(res.itemGained&&S.inv.length<8)S.inv.push(res.itemGained);
    if(res.location)S.scene=res.location;
    updateStats();
    if(res.event==='loot'||res.event==='magic')sndPickup();
    else if(res.goldChange>0)sndCoin();
    else if(res.event==='rest')sndHeal();
    else if(res.event==='encounter'&&res.hpChange<0)sndBump();
    speak(res.narrative.join(' '));
    res.narrative.forEach((l,i)=>setTimeout(()=>log(l,res.event==='loot'?'good':res.event==='encounter'&&res.hpChange<0?'bad':'info'),i*400));
    const delay=res.narrative.length*400+200;
    if(res.event==='gameover'){setTimeout(()=>{log('💤 You dozed off peacefully!','sys');const inner=document.getElementById('choices-inner');inner.innerHTML='<button class="choice-btn" style="flex:none" onclick="startGame()">▸ WAKE UP & TRY AGAIN</button>';},delay);return;}
    setTimeout(()=>renderChoices(res.choices),delay);
  }catch(e){isWalking=false;console.error(e);log('[ The innkeeper spilled the tea — try again! ]','sys');renderChoices(allChoices);}
}

async function startGame(){
  S.hp=20;S.maxHp=20;S.xp=0;S.gold=5;S.inv=[];S.history=[];S.scene='meadow';
  updateStats();document.getElementById('log-box').innerHTML='';setStatus('▸ Loading world...');
  try{
    const res=await callClaude('BEGIN GAME. Welcome the wanderer warmly. Cozy hobbit-core tone. Start in the meadow on a sunny morning.');
    if(res.location)S.scene=res.location;updateStats();
    speak(res.narrative.join(' '));
    res.narrative.forEach((l,i)=>setTimeout(()=>log(l,'info'),i*500));
    setTimeout(()=>renderChoices(res.choices),res.narrative.length*500+200);
  }catch(e){console.error(e);setStatus('[ Could not reach the realm — click to retry ]');document.getElementById('choices-inner').innerHTML='<button class="choice-btn" style="flex:none" onclick="startGame()">▸ RETRY</button>';}
}

window.onload=()=>{
  updateStats();resizeCanvas();window.addEventListener('resize',resizeCanvas);renderScene();
  log('Welcome, Wanderer! 🍄','sys');
  document.getElementById('choices-inner').innerHTML='<button class="choice-btn" style="flex:none" onclick="startGame()">▸ BEGIN YOUR ADVENTURE</button>';
};
</script>
